<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台科領寒假禪定打卡平台 - Google 雲端版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            background: url('https://images.unsplash.com/photo-1448375240586-dfd8d30168f7?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #064e3b;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; 
        }
        .card { 
            background: rgba(255, 255, 255, 0.88); 
            backdrop-filter: blur(12px);
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
        }
        .progress-fill { 
            height: 100%; 
            background: linear-gradient(90deg, #34d399, #059669); 
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .remind-btn { background: #06C755; color: white; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .unlocked-pet { animation: float 3s infinite ease-in-out; }
        .google-btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: white; border: 1px solid #ddd; transition: all 0.2s; }
        .google-btn:hover { background: #f8f8f8; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="min-h-screen p-4 pb-24">

    <div id="loginOverlay" class="fixed inset-0 z-[100] flex items-center justify-center bg-emerald-900/60 backdrop-blur-md px-6 hidden">
        <div class="card p-8 w-full max-w-sm text-center">
            <h2 class="text-2xl font-black text-emerald-800 mb-2">🌲 森林通行證</h2>
            <p class="text-xs text-emerald-600 mb-8">使用 Google 帳號感應進入森林</p>
            <button onclick="handleGoogleLogin()" class="google-btn w-full py-4 rounded-2xl font-bold active:scale-95">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-6 h-6">
                Google 帳號登入
            </button>
        </div>
    </div>

    <div id="successModal" class="fixed inset-0 z-[60] flex items-center justify-center hidden px-6">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
        <div class="relative card p-8 w-full max-w-sm text-center">
            <div class="text-5xl mb-4">✨</div>
            <h2 class="text-2xl font-black text-emerald-800 mb-2">注入成功！</h2>
            <p class="text-emerald-600 mb-6">獲得了 <span id="successCoins" class="text-3xl font-black text-emerald-500">0</span> 點能量</p>
            <button onclick="document.getElementById('successModal').classList.add('hidden')" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold">確認</button>
        </div>
    </div>

    <div id="evoModal" class="fixed inset-0 z-50 flex items-center justify-center hidden px-6">
        <div class="absolute inset-0 bg-emerald-900/60 backdrop-blur-md"></div>
        <div class="relative card p-8 w-full max-w-sm text-center bg-white">
            <h2 class="text-2xl font-black text-emerald-800 mb-2">🎊 恭喜進化！</h2>
            <div class="bg-emerald-50 rounded-3xl p-6 mb-6">
                <img id="modalImg" src="" class="w-24 h-24 mx-auto drop-shadow-2xl mb-3">
                <div id="modalName" class="text-xl font-bold text-emerald-900"></div>
            </div>
            <button onclick="document.getElementById('evoModal').classList.add('hidden')" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold">太棒了！</button>
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="https://cdn.pixabay.com/audio/2022/03/24/audio_73130c2c13.mp3" type="audio/mpeg">
    </audio>

    <div class="max-w-md mx-auto space-y-6">
        <header class="text-center py-6">
            <h1 class="text-3xl font-black text-emerald-900">台科領寒假禪定打卡</h1>
            <div class="mt-3 flex items-center justify-center gap-2">
                <img id="userAvatar" src="" class="w-6 h-6 rounded-full hidden">
                <span id="displayUser" class="text-[10px] bg-emerald-700 text-white px-3 py-1 rounded-full font-bold">驗證中...</span>
                <button onclick="logout()" class="text-[9px] text-emerald-600 underline">登出</button>
            </div>
        </header>

        <div class="card p-5 text-center">
            <div id="rankDisplay" class="text-xs font-bold mb-2 text-emerald-800">載入中...</div>
            <div id="totalTimeDisplay" class="text-[10px] font-bold text-emerald-600 mb-3 bg-white/50 py-1 px-3 rounded-full inline-block">累積：0 分鐘</div>
            <div class="h-3 w-full bg-emerald-100 rounded-full overflow-hidden">
                <div id="progressBarFill" class="progress-fill" style="width: 0%"></div>
            </div>
        </div>

        <div class="card p-6 space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-emerald-900">修行者</label>
                    <input type="text" id="usernameField" disabled class="w-full p-3 text-sm rounded-xl bg-emerald-50 opacity-70">
                </div>
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-emerald-900">時間(分鐘)</label>
                    <input type="number" id="minutes" placeholder="10" class="w-full p-3 text-sm rounded-xl outline-none ring-1 ring-emerald-100 focus:ring-emerald-500">
                </div>
            </div>
            <textarea id="note" placeholder="記錄此時此刻的心情..." class="w-full p-3 text-sm h-20 rounded-xl outline-none ring-1 ring-emerald-100 focus:ring-emerald-500"></textarea>
            <button onclick="saveRecord()" class="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold shadow-lg active:scale-95">送出紀錄</button>
        </div>

        <div id="unlockedGrid" class="grid grid-cols-3 gap-4 px-2"></div>

        <div class="card p-5">
            <h2 class="font-bold mb-3 text-sm border-b pb-2">🏆 森林能量累積榜</h2>
            <div id="leaderboard" class="space-y-2 text-xs"></div>
        </div>

        <div class="card p-5">
            <h2 class="font-bold mb-3 text-sm border-b pb-2">📖 夥伴練習日誌</h2>
            <div id="historyLogs" class="space-y-6 max-h-60 overflow-y-auto text-xs"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://szzpoyluooexmshcmpmk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tsVcpheph5XujUP9CGPRwA_pMlGNpb3';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const characters = [
            { name: '懶石頭', req: 0, img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/1.png' },
            { name: '雲朵雞', req: 100, img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/2.png' },
            { name: '綠毛蟲', req: 200, img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/3.png' },
            { name: '波波貓', req: 300, img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/4.png' },
            { name: '狐狸仙', req: 400, img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/5.png' },
            { name: '鹿角獸', req: 500, img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/6.png' },
            { name: '獨角鯨', req: 600, img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/7.png' },
            { name: '大白龍', req: 700, img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/8.png' },
            { name: '火鳳凰', req: 800, img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/9.png' },
            { name: '星系主', req: 900, img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/10.png' }
        ];

        let currentUser = "";
        let musicStarted = false;
        let cachedUserScores = {};

        // 初始化與監聽狀態
        async function init() {
            const { data: { session } } = await client.auth.getSession();
            updateAuthState(session);

            client.auth.onAuthStateChange((_event, session) => {
                updateAuthState(session);
            });
        }

        function updateAuthState(session) {
            const overlay = document.getElementById('loginOverlay');
            if (session) {
                overlay.classList.add('hidden');
                currentUser = session.user.user_metadata.full_name || session.user.email.split('@')[0];
                document.getElementById('displayUser').innerText = `修行者：${currentUser}`;
                document.getElementById('usernameField').value = currentUser;
                if(session.user.user_metadata.avatar_url) {
                    const img = document.getElementById('userAvatar');
                    img.src = session.user.user_metadata.avatar_url;
                    img.classList.remove('hidden');
                }
                fetchData();
                startMusic();
            } else {
                overlay.classList.remove('hidden');
                currentUser = "";
            }
        }

        async function handleGoogleLogin() {
            const { error } = await client.auth.signInWithOAuth({
                provider: 'google',
                options: { 
                    redirectTo: window.location.origin,
                    queryParams: { prompt: 'select_account' }
                }
            });
            if (error) alert("登入錯誤: " + error.message);
        }

        async function logout() {
            await client.auth.signOut();
            location.reload();
        }

        function startMusic() {
            if (!musicStarted) {
                document.getElementById('bgMusic').play().catch(() => {});
                musicStarted = true;
            }
        }

        async function fetchData() {
            const { data: logs, error } = await client.from('meditation_logs').select('*').order('created_at', { ascending: false });
            if (error) return;

            cachedUserScores = {};
            let userMinutes = {};
            logs.forEach(l => {
                cachedUserScores[l.username] = (cachedUserScores[l.username] || 0) + l.coins;
                userMinutes[l.username] = (userMinutes[l.username] || 0) + (l.minutes || 0);
            });

            const myScore = cachedUserScores[currentUser] || 0;
            const next = characters.find(c => c.req > myScore) || characters[9];
            document.getElementById('progressBarFill').style.width = Math.min(100, (myScore/next.req)*100) + '%';
            document.getElementById('rankDisplay').innerText = `☀️ 能量：${myScore} / 下一階段：${next.req}`;
            document.getElementById('totalTimeDisplay').innerText = `累積：${userMinutes[currentUser] || 0} 分鐘`;

            const sorted = Object.entries(cachedUserScores).sort((a,b) => b[1]-a[1]);
            document.getElementById('leaderboard').innerHTML = sorted.slice(0, 10).map(([n, s], i) => `
                <div class="flex justify-between items-center p-2 ${n===currentUser?'bg-emerald-100 border-l-4 border-emerald-500':'bg-white/50'} rounded">
                    <span>${i+1}. ${n}</span>
                    <span class="font-mono text-emerald-600">${s} pts</span>
                </div>
            `).join('');

            document.getElementById('historyLogs').innerHTML = logs.map(l => `
                <div class="border-b border-emerald-100 pb-2">
                    <div class="flex justify-between font-bold"><span>${l.username} (${l.minutes}m)</span><span class="text-emerald-600">+${l.coins}</span></div>
                    <div class="italic text-gray-600">"${l.note}"</div>
                </div>
            `).join('');

            document.getElementById('unlockedGrid').innerHTML = characters.filter(c => myScore >= c.req).map(c => `
                <div class="flex flex-col items-center p-3 bg-white/80 rounded-2xl unlocked-pet shadow-sm">
                    <img src="${c.img}" class="w-10 h-10 object-contain">
                    <span class="text-[8px] mt-1 font-bold">${c.name}</span>
                </div>
            `).join('');
        }

        async function saveRecord() {
            const mins = parseInt(document.getElementById('minutes').value);
            const note = document.getElementById('note').value.trim();
            if (!mins || !note || mins < 10) return alert("最少需禪定 10 分鐘並寫下心情內容唷！");

            let coins = (mins >= 30) ? 40 : (mins >= 20) ? 30 : 10;
            const currentScore = cachedUserScores[currentUser] || 0;
            const beforeLevel = characters.filter(c => currentScore >= c.req).length;

            const { error } = await client.from('meditation_logs').insert([{ username: currentUser, minutes: mins, note, coins }]);

            if (!error) {
                const afterLevel = characters.filter(c => (currentScore + coins) >= c.req).length;
                if (afterLevel > beforeLevel) {
                    document.getElementById('modalImg').src = characters[afterLevel-1].img;
                    document.getElementById('modalName').innerText = characters[afterLevel-1].name;
                    document.getElementById('evoModal').classList.remove('hidden');
                } else {
                    document.getElementById('successCoins').innerText = coins;
                    document.getElementById('successModal').classList.remove('hidden');
                }
                document.getElementById('minutes').value = "";
                document.getElementById('note').value = "";
                fetchData();
            } else {
                alert("注入失敗: " + error.message);
            }
        }

        init();
        setInterval(fetchData, 15000);
    </script>
</body>
</html>
