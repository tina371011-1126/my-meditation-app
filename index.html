<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寒假禪定打卡平台 - 夢幻星空版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* 使用你提供的星空圖片作為背景 */
        body { 
            background: url('https://i.pinimg.com/474x/4e/dd/bc/4eddbc60fdb23239abfccb073e2c98f9.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f0f9ff; 
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; 
        }
        
        .card { 
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(15px);
            border-radius: 28px; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .progress-fill { height: 100%; background: linear-gradient(90deg, #60a5fa, #c084fc); transition: width 1s ease-in-out; }
        
        input, textarea { 
            background: rgba(255, 255, 255, 0.1) !important; 
            color: white !important; 
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            border-radius: 16px !important;
        }
        
        input::placeholder, textarea::placeholder { color: #cbd5e1; }

        .history-item { border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 1rem; }
        
        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .unlocked-pet { animation: gentle-bounce 2s infinite ease-in-out; }
    </style>
</head>
<body class="min-h-screen p-4 pb-24">
    <audio id="bgMusic" loop preload="auto">
        <source src="https://cdn.pixabay.com/audio/2022/03/24/audio_73130c2c13.mp3" type="audio/mpeg">
    </audio>

    <div class="max-w-md mx-auto space-y-6">
        <header class="text-center py-6">
            <h1 class="text-3xl font-black tracking-widest text-white drop-shadow-lg">寒假禪定打卡平台</h1>
            <p class="text-xs text-sky-200 mt-2 opacity-90 italic">♫ 點擊或輸入即可開啟靜心旋律</p>
        </header>

        <div class="card p-6 text-center">
            <div id="rankDisplay" class="text-sm font-bold mb-3 text-sky-100 italic">連線雲端中...</div>
            <div class="h-3 w-full bg-black/20 rounded-full overflow-hidden border border-white/30">
                <div id="progressBarFill" class="progress-fill" style="width: 0%"></div>
            </div>
            <div class="flex justify-between mt-2 text-[10px] text-sky-300 font-bold">
                <span>初心</span><span>彼岸</span>
            </div>
        </div>

        <div class="card p-6 space-y-4">
            <input type="text" id="username" placeholder="你是誰～" class="w-full p-4 outline-none" oninput="startMusic(); fetchData();">
            <input type="number" id="minutes" placeholder="禪定幾分鐘？" class="w-full p-4 outline-none">
            <textarea id="note" placeholder="寫下修煉心得..." class="w-full p-4 outline-none h-24"></textarea>
            <button onclick="saveRecord()" class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition-all">送出紀錄，能量進化</button>
        </div>

        <div class="space-y-4">
            <h2 class="font-bold text-white text-lg ml-2 flex items-center gap-2">✨ 已覺醒靈獸</h2>
            <div id="unlockedGrid" class="grid grid-cols-3 gap-3"></div>
        </div>

        <div class="card p-6">
            <h2 class="font-bold mb-4 text-sky-100 border-b border-white/20 pb-2">🏆 修行榜單</h2>
            <div id="leaderboard" class="space-y-3 text-sm"></div>
        </div>

        <div class="card p-6">
            <h2 class="font-bold mb-4 text-sky-100 border-b border-white/20 pb-2">📖 修煉日誌</h2>
            <div id="historyLogs" class="space-y-4 max-h-96 overflow-y-auto pr-2 text-sm"></div>
        </div>
    </div>

    <script>
        // --- 請確保填入你的 Supabase 資訊 ---
        const SUPABASE_URL = 'https://szzpoyluooexmshcmpmk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tsVcpheph5XujUP9CGPRwA_pMlGNpb3';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const characters = [
            { name: '懶石頭', req: 0, img: 'https://cdn-icons-png.flaticon.com/512/2602/2602465.png' },
            { name: '雲朵雞', req: 100, img: 'https://cdn-icons-png.flaticon.com/512/2663/2663067.png' },
            { name: '綠毛蟲', req: 200, img: 'https://cdn-icons-png.flaticon.com/512/805/805404.png' },
            { name: '波波貓', req: 300, img: 'https://cdn-icons-png.flaticon.com/512/616/616430.png' },
            { name: '狐狸仙', req: 400, img: 'https://cdn-icons-png.flaticon.com/512/235/235880.png' },
            { name: '鹿角獸', req: 500, img: 'https://cdn-icons-png.flaticon.com/512/2219/2219774.png' },
            { name: '獨角鯨', req: 600, img: 'https://cdn-icons-png.flaticon.com/512/2040/2040510.png' },
            { name: '大白龍', req: 700, img: 'https://cdn-icons-png.flaticon.com/512/616/616606.png' },
            { name: '火鳳凰', req: 800, img: 'https://cdn-icons-png.flaticon.com/512/2026/2026462.png' },
            { name: '星系主', req: 900, img: 'https://cdn-icons-png.flaticon.com/512/2534/2534064.png' }
        ];

        let cachedUserScores = {};
        let musicStarted = false;

        function startMusic() {
            if (!musicStarted) {
                document.getElementById('bgMusic').play().then(() => { musicStarted = true; }).catch(() => {});
            }
        }
        window.addEventListener('click', startMusic);

        async function fetchData() {
            const { data: logs, error } = await client.from('meditation_logs').select('*').order('created_at', { ascending: false });
            if(error) { console.error("同步失敗:", error); return; }

            cachedUserScores = {};
            logs.forEach(l => {
                cachedUserScores[l.username] = (cachedUserScores[l.username] || 0) + l.coins;
            });
            updateUI(logs, cachedUserScores);
        }

        function updateUI(logs, userScores) {
            const name = document.getElementById('username').value.trim();
            const myScore = userScores[name] || 0;

            // 1. 排行榜
            const sorted = Object.entries(userScores).sort((a,b) => b[1]-a[1]);
            document.getElementById('leaderboard').innerHTML = sorted.slice(0, 10).map(([n, s], i) => `
                <div class="flex justify-between p-2 bg-white/10 rounded-lg mb-1">
                    <span class="${n === name ? 'text-blue-300 font-bold' : ''}">${i+1}. ${n}</span>
                    <span>${s} 幣</span>
                </div>
            `).join('');

            // 2. 進度條
            const next = characters.find(c => c.req > myScore) || characters[9];
            const prog = myScore >= 900 ? 100 : (myScore / next.req) * 100;
            document.getElementById('progressBarFill').style.width = prog + '%';
            document.getElementById('rankDisplay').innerHTML = name ? 
                (myScore >= 900 ? `✨ 已覺醒：星系主` : `距離進化還差 ${next.req - myScore} 幣`) : "同步修行中...";

            // 3. 圖鑑 (只呈現象解鎖的)
            const unlocked = characters.filter(c => myScore >= c.req);
            document.getElementById('unlockedGrid').innerHTML = unlocked.map(c => `
                <div class="card p-3 flex flex-col items-center unlocked-pet">
                    <img src="${c.img}" class="w-10 h-10 mb-2">
                    <span class="text-[10px] font-bold text-white">${c.name}</span>
                </div>
            `).join('');

            // 4. 日誌
            document.getElementById('historyLogs').innerHTML = logs.map(l => `
                <div class="history-item mt-4">
                    <div class="flex justify-between items-center text-blue-200 font-bold">
                        <span>${l.username}</span><span>${l.coins} 幣</span>
                    </div>
                    <p class="mt-2 bg-black/20 p-2 rounded-lg italic">"${l.note || '靜修中...'}"</p>
                </div>
            `).join('');
        }

        async function saveRecord() {
            const username = document.getElementById('username').value.trim();
            const minutes = parseInt(document.getElementById('minutes').value);
            const note = document.getElementById('note').value;
            if(!username || !minutes) return alert('請填寫完整資訊');

            const oldScore = cachedUserScores[username] || 0;
            const oldLevelCount = characters.filter(c => oldScore >= c.req).length;

            let coins = 0;
            if (minutes >= 40) coins = 40;
            else if (minutes >= 30) coins = 20;
            else if (minutes >= 20) coins = 10;
            else return alert('時間不足 20 分鐘');

            const { error } = await client.from('meditation_logs').insert([{ username, minutes, note, coins }]);
            if(error) alert('儲存失敗');
            else {
                const newScore = oldScore + coins;
                const newLevelCount = characters.filter(c => newScore >= c.req).length;
                if (newLevelCount > oldLevelCount) {
                    alert(`🎊 恭喜！你已成功覺醒為：【${characters[newLevelCount-1].name}】！`);
                } else {
                    alert(`紀錄成功！獲得了 ${coins} 枚幣。`);
                }
                document.getElementById('minutes').value = '';
                document.getElementById('note').value = '';
                fetchData();
            }
        }

        setInterval(fetchData, 10000);
        fetchData();
    </script>
</body>
</html>
