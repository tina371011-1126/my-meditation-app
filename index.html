<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台科領寒假禪定打卡平台 - 森林高畫質版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            /* 使用 Google Drive 直連連結，並確保高解析度呈現 */
            background: url('https://lh3.googleusercontent.com/d/1YQAYwbwwn-GJJE0S41aIHWiDlIXJilWc');
            background-size: cover;
            background-position: center top; /* 向上對齊，保留上方雲朵美景 */
            background-attachment: fixed;
            background-repeat: no-repeat;
            image-rendering: -webkit-optimize-contrast; /* 增強圖像解析度視覺感 */
            color: #064e3b;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; 
        }

        /* 標題優化：增加多層陰影提升易讀性 */
        .title-gradient {
            color: #166534;
            filter: drop-shadow(0 2px 4px rgba(255,255,255,0.8)) drop-shadow(0 0 10px rgba(255,255,255,0.5));
            letter-spacing: 0.1em;
        }

        .card { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); /* 增加磨砂玻璃質感，對抗細節多的背景 */
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
        }

        .progress-fill { 
            height: 100%; 
            background: linear-gradient(90deg, #34d399, #059669); 
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.5);
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        input, textarea { 
            background: rgba(255, 255, 255, 0.9) !important; 
            border: 1.5px solid #d1fae5 !important;
            border-radius: 12px !important;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #10b981 !important;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2) !important;
        }

        .forest-text { color: #064e3b; }

        .history-item { border-bottom: 1px solid rgba(16, 185, 129, 0.1); }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .unlocked-pet { animation: float 3s infinite ease-in-out; }

        /* 捲軸美化 */
        #historyLogs::-webkit-scrollbar { width: 5px; }
        #historyLogs::-webkit-scrollbar-thumb { background: #6ee7b7; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-4 pb-24">
    <audio id="bgMusic" loop preload="auto">
        <source src="https://cdn.pixabay.com/audio/2022/03/24/audio_73130c2c13.mp3" type="audio/mpeg">
    </audio>

    <div class="max-w-md mx-auto space-y-6">
        <header class="text-center py-6">
            <h1 class="text-3xl font-black title-gradient">台科領寒假禪定打卡</h1>
            <div class="mt-2">
                <span class="text-[10px] bg-emerald-600 text-white px-3 py-1 rounded-full font-bold shadow-sm">森林修煉模式啟動中</span>
            </div>
        </header>

        <div class="card p-5 text-center">
            <div id="rankDisplay" class="text-xs font-bold mb-3 text-emerald-800 tracking-wide">正在感應森林能量...</div>
            <div class="h-3 w-full bg-emerald-100 rounded-full overflow-hidden shadow-inner">
                <div id="progressBarFill" class="progress-fill" style="width: 0%"></div>
            </div>
            <div class="flex justify-between mt-2 text-[10px] text-emerald-700 font-bold px-1">
                <span>🌱 種子</span><span>🌳 守護大樹</span>
            </div>
        </div>

        <div class="card p-6 space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-emerald-900 ml-1">修行者大名</label>
                    <input type="text" id="username" placeholder="輸入名字" class="w-full p-3 text-sm" oninput="startMusic(); fetchData();">
                </div>
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-emerald-900 ml-1">禪定時間(分)</label>
                    <input type="number" id="minutes" placeholder="分鐘" class="w-full p-3 text-sm">
                </div>
            </div>
            <div class="space-y-1">
                <label class="text-[11px] font-bold text-emerald-900 ml-1">今日修煉心得 (必填)</label>
                <textarea id="note" placeholder="記錄當下的平靜..." class="w-full p-3 text-sm h-20 outline-none"></textarea>
            </div>
            <button onclick="saveRecord()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-bold shadow-md transform active:scale-95 transition-all text-sm tracking-widest">
                送出紀錄 ‧ 注入能量
            </button>
        </div>

        <div class="space-y-3">
            <h2 class="font-bold text-emerald-900 text-sm ml-2 flex items-center gap-2">
                <span class="w-2 h-2 bg-emerald-500 rounded-full"></span> 已覺醒精靈
            </h2>
            <div id="unlockedGrid" class="grid grid-cols-4 gap-2"></div>
        </div>

        <div class="grid grid-cols-1 gap-6">
            <div class="card p-5">
                <h2 class="font-bold mb-3 text-emerald-900 text-sm border-b border-emerald-100 pb-2">🏆 修煉能量榜</h2>
                <div id="leaderboard" class="space-y-2 text-xs"></div>
            </div>

            <div class="card p-5">
                <h2 class="font-bold mb-3 text-emerald-900 text-sm border-b border-emerald-100 pb-2">📖 眾人修行誌</h2>
                <div id="historyLogs" class="space-y-4 max-h-64 overflow-y-auto pr-2 text-xs"></div>
            </div>
        </div>
    </div>

    <script>
        // Supabase 配置
        const SUPABASE_URL = 'https://szzpoyluooexmshcmpmk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tsVcpheph5XujUP9CGPRwA_pMlGNpb3';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const characters = [
            { name: '懶石頭', req: 0, img: 'https://cdn-icons-png.flaticon.com/512/2602/2602465.png' },
            { name: '雲朵雞', req: 100, img: 'https://cdn-icons-png.flaticon.com/512/2663/2663067.png' },
            { name: '綠毛蟲', req: 200, img: 'https://cdn-icons-png.flaticon.com/512/805/805404.png' },
            { name: '波波貓', req: 300, img: 'https://cdn-icons-png.flaticon.com/512/616/616430.png' },
            { name: '狐狸仙', req: 400, img: 'https://cdn-icons-png.flaticon.com/512/235/235880.png' },
            { name: '鹿角獸', req: 500, img: 'https://cdn-icons-png.flaticon.com/512/2219/2219774.png' },
            { name: '獨角鯨', req: 600, img: 'https://cdn-icons-png.flaticon.com/512/2040/2040510.png' },
            { name: '大白龍', req: 700, img: 'https://cdn-icons-png.flaticon.com/512/616/616606.png' },
            { name: '火鳳凰', req: 800, img: 'https://cdn-icons-png.flaticon.com/512/2026/2026462.png' },
            { name: '星系主', req: 900, img: 'https://cdn-icons-png.flaticon.com/512/2534/2534064.png' }
        ];

        let cachedUserScores = {};
        let musicStarted = false;

        function startMusic() {
            if (!musicStarted) {
                document.getElementById('bgMusic').play().then(() => { musicStarted = true; }).catch(() => {});
            }
        }

        async function fetchData() {
            const { data: logs, error } = await client.from('meditation_logs').select('*').order('created_at', { ascending: false });
            if(error) return;
            cachedUserScores = {};
            logs.forEach(l => { cachedUserScores[l.username] = (cachedUserScores[l.username] || 0) + l.coins; });
            updateUI(logs, cachedUserScores);
        }

        function updateUI(logs, userScores) {
            const name = document.getElementById('username').value.trim();
            const myScore = userScores[name] || 0;

            const sorted = Object.entries(userScores).sort((a,b) => b[1]-a[1]);
            document.getElementById('leaderboard').innerHTML = sorted.slice(0, 8).map(([n, s], i) => `
                <div class="flex justify-between items-center p-2 ${n === name ? 'bg-emerald-100 border-l-4 border-emerald-500' : 'bg-white/50'} rounded shadow-sm">
                    <span class="font-bold">${i+1}. ${n}</span>
                    <span class="text-emerald-600 font-mono">${s} pts</span>
                </div>
            `).join('') || '尚無紀錄';

            const next = characters.find(c => c.req > myScore) || characters[9];
            const prog = myScore >= 900 ? 100 : (myScore / next.req) * 100;
            document.getElementById('progressBarFill').style.width = prog + '%';
            document.getElementById('rankDisplay').innerText = name ? `目前進度：${myScore} 能量 (目標: ${next.req})` : "請輸入名字以同步森林能量";

            const unlocked = characters.filter(c => myScore >= c.req);
            document.getElementById('unlockedGrid').innerHTML = unlocked.map(c => `
                <div class="flex flex-col items-center p-2 bg-white/80 rounded-xl shadow-sm unlocked-pet">
                    <img src="${c.img}" class="w-8 h-8 opacity-90">
                    <span class="text-[8px] mt-1 font-bold text-emerald-800">${c.name}</span>
                </div>
            `).join('');

            document.getElementById('historyLogs').innerHTML = logs.map(l => `
                <div class="history-item pb-3">
                    <div class="flex justify-between font-bold text-emerald-900 mb-1">
                        <span>${l.username}</span><span class="text-[10px]">+${l.coins}</span>
                    </div>
                    <div class="p-2 bg-white/60 rounded italic text-emerald-800 leading-relaxed shadow-sm">"${l.note}"</div>
                </div>
            `).join('');
        }

        async function saveRecord() {
            const username = document.getElementById('username').value.trim();
            const minutes = parseInt(document.getElementById('minutes').value);
            const note = document.getElementById('note').value.trim();
            if(!username || !minutes || !note) return alert('請完整填寫資訊');

            let coins = 0;
            if (minutes >= 40) coins = 40;
            else if (minutes >= 30) coins = 20;
            else if (minutes >= 20) coins = 10;
            else return alert('最少需修行 20 分鐘喔！');

            const { error } = await client.from('meditation_logs').insert([{ username, minutes, note, coins }]);
            if(error) alert('系統忙碌中');
            else {
                alert(`注入成功！獲得了 ${coins} 點能量。`);
                document.getElementById('minutes').value = '';
                document.getElementById('note').value = '';
                fetchData();
            }
        }
        setInterval(fetchData, 15000);
        fetchData();
    </script>
</body>
</html>
