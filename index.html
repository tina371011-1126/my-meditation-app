<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禪定精靈 - 粒子召喚版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        zen: { 900: '#0c4a6e', 950: '#082f49' },
                        gold: { DEFAULT: '#fbbf24', glow: '#fcd34d' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background: linear-gradient(to bottom, #082f49, #0f172a); color: #e0f2fe; font-family: 'PingFang TC', sans-serif; overflow-x: hidden; }
        .glass-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border-radius: 24px; border: 1px solid rgba(56, 189, 248, 0.2); }
        .calendar-dot { width: 8px; height: 8px; border-radius: 50%; margin: 2px auto; }
        .dot-filled { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
        .dot-empty { border: 1px solid rgba(56, 189, 248, 0.4); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .btn-gradient { background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%); transition: all 0.3s; }
        .btn-disabled { background: #334155 !important; opacity: 0.5; cursor: not-allowed; transform: scale(1) !important; }

        /* 水晶球震動與聚能動畫 */
        @keyframes super-shake {
            0% { transform: translate(0,0) scale(1); }
            20% { transform: translate(-5px, 5px) scale(1.05); }
            40% { transform: translate(5px, -5px) scale(1.1); }
            60% { transform: translate(-8px, -8px) scale(1.15); }
            80% { transform: translate(8px, 8px) scale(1.2); }
            100% { transform: translate(0,0) scale(1.3); opacity: 0; }
        }
        .crystal-active { animation: super-shake 1.5s forwards; }

        /* 粒子粒子容器 */
        #particleCanvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 250; }
    </style>
</head>
<body class="min-h-screen p-4 pb-24">

    <canvas id="particleCanvas"></canvas>

    <div id="summoningOverlay" class="fixed inset-0 z-[200] flex flex-col items-center justify-center bg-black/95 backdrop-blur-2xl hidden">
        <div id="ballContainer" class="relative">
            <div id="mainBall" class="w-32 h-32 rounded-full bg-gradient-to-br from-sky-300 to-blue-600 shadow-[0_0_50px_#3b82f6] flex items-center justify-center relative overflow-hidden">
                <div class="absolute inset-0 bg-white/20 animate-pulse"></div>
                <span class="text-5xl">🔮</span>
            </div>
            <div class="absolute -inset-4 border-2 border-gold/30 rounded-full animate-spin-slow"></div>
        </div>
        <p id="summonText" class="mt-12 text-gold font-bold tracking-[0.4em] animate-pulse text-lg">凝聚禪定能量...</p>
    </div>

    <div class="max-w-md mx-auto space-y-6 pt-2">
        <header class="flex justify-between items-center py-2 px-1">
            <div>
                <h1 class="text-xl font-black text-sky-200 tracking-wider">禪定精靈調頻</h1>
                <p id="streakDisplay" class="text-[10px] text-gold font-bold mt-1">偵測能量中...</p>
            </div>
            <img id="userAvatar" src="https://www.svgrepo.com/show/384674/account-avatar-profile-user-11.svg" class="w-10 h-10 rounded-full border-2 border-sky-500/50">
        </header>

        <div class="glass-card p-5">
            <h2 id="calendarMonth" class="text-center text-sm font-bold mb-4 text-sky-200 border-b border-sky-800/50 pb-2">精靈紀錄</h2>
            <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center"></div>
        </div>

        <div id="personalSection" class="hidden space-y-2">
            <h2 class="font-bold text-sky-200 text-sm ml-2 flex items-center gap-2">
                <span class="w-2 h-2 bg-gold rounded-full animate-pulse"></span> 
                <span>🍃 我的專屬禪定時光</span>
            </h2>
            <div id="personalSlider" class="flex gap-3 overflow-x-auto pb-2 hide-scrollbar snap-x px-1"></div>
        </div>

        <div class="glass-card p-6 space-y-4">
            <h2 class="font-bold text-sky-200 text-sm border-b border-sky-800/50 pb-2">🧘 禪定打卡</h2>
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[10px] text-sky-400">調頻時空 (可補打卡)</label>
                    <input type="date" id="recordDate" class="w-full p-2.5 text-xs rounded-xl bg-sky-900/40 border border-sky-700/50 text-white outline-none">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] text-sky-400">分鐘數</label>
                    <input type="number" id="minutes" oninput="validateForm()" placeholder="至少10分鐘" class="w-full p-2.5 text-xs rounded-xl bg-sky-900/40 border border-sky-700/50 text-white outline-none">
                </div>
            </div>
            <textarea id="note" oninput="validateForm()" placeholder="記錄此刻的禪定心得..." class="w-full p-3 text-xs h-20 rounded-xl bg-sky-900/40 border border-sky-700/50 text-white outline-none resize-none"></textarea>
            
            <button id="saveBtn" onclick="triggerSummon()" disabled class="w-full btn-gradient btn-disabled py-4 rounded-xl font-bold text-white shadow-lg flex items-center justify-center gap-2 active:scale-95">
                <span>匯聚能量 ‧ 召喚精靈</span>
                <span id="btnIcon">🔒</span>
            </button>
        </div>

        <div class="glass-card p-5">
            <h2 class="font-bold mb-4 text-sm text-sky-300 flex justify-between items-center">
                <span>📚 精靈圖鑑</span>
                <span id="collectionCount" class="text-[10px] bg-sky-900 px-2 py-1 rounded text-gold">0/20</span>
            </h2>
            <div id="spiritGrid" class="grid grid-cols-4 gap-3"></div>
        </div>
    </div>

    <div id="gachaModal" class="fixed inset-0 z-[300] flex items-center justify-center hidden px-6">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
        <div class="relative glass-card p-8 w-full max-w-sm text-center border-2 border-gold shadow-[0_0_30px_rgba(251,191,36,0.3)]">
            <h2 class="text-gold font-bold mb-4 text-xl tracking-widest">✨ 獲得新精靈 ✨</h2>
            <img id="gachaImg" src="" class="w-32 h-32 mx-auto mb-6 object-contain drop-shadow-[0_0_15px_rgba(255,255,255,0.5)]">
            <div id="gachaName" class="text-2xl font-black text-white mb-2"></div>
            <p id="gachaDesc" class="text-xs text-sky-300 mb-8 italic"></p>
            <button onclick="closeGacha()" class="w-full btn-gradient text-white py-3 rounded-xl font-bold">收入圖鑑</button>
        </div>
    </div>

    <script>
        // --- 粒子效果邏輯 ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', initCanvas);
        initCanvas();

        class Particle {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.size = Math.random() * 5 + 2;
                this.speedX = (Math.random() - 0.5) * 15;
                this.speedY = (Math.random() - 0.5) * 15;
                this.color = `hsl(${Math.random() * 40 + 30}, 100%, 70%)`; // 金色系
                this.opacity = 1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.opacity -= 0.02;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createExplosion(x, y) {
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle(x, y));
            }
            animateParticles();
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = particles.filter(p => p.opacity > 0);
            particles.forEach(p => { p.update(); p.draw(); });
            if (particles.length > 0) requestAnimationFrame(animateParticles);
        }

        // --- 召喚流程邏輯 ---
        function triggerSummon() {
            const overlay = document.getElementById('summoningOverlay');
            const ball = document.getElementById('mainBall');
            const text = document.getElementById('summonText');
            
            overlay.classList.remove('hidden');
            
            // 階段一：聚能
            setTimeout(() => {
                ball.classList.add('crystal-active');
                text.innerText = "能量達到臨界點！";
                text.classList.add('text-white');
            }, 500);

            // 階段二：爆炸
            setTimeout(() => {
                createExplosion(window.innerWidth / 2, window.innerHeight / 2);
                overlay.classList.add('hidden');
                ball.classList.remove('crystal-active');
                saveRecord(); // 執行原本的儲存與顯示彈窗邏輯
            }, 2000);
        }

        // --- 原有邏輯 (簡化示意) ---
        const spiritPool = [
            { name: '初心苔蘚', desc: '柔軟且謙卑的初發心', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/1.png' },
            { name: '數息小童', desc: '專注呼吸的靈體', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/2.png' },
            { name: '不倒翁念頭', desc: '念頭來去，我自歸中', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/3.png' },
            { name: '止語貝殼', desc: '收藏著宇宙的寂靜', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/4.png' },
            { name: '公案青蛙', desc: '跳進水裡的頓悟聲', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/5.png' },
            { name: '定心石怪', desc: '如如不動，堅若磐石', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/6.png' },
            { name: '香燃煙靈', desc: '隨風而逝的無常', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/7.png' },
            { name: '木魚響響', desc: '清醒的節奏精靈', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/8.png' },
            { name: '蓮座花精', desc: '純淨的心靈花朵', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/9.png' },
            { name: '虛空水母', desc: '漂浮在空性之海', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/10.png' },
            { name: '觀照之眼', desc: '洞察真實的智慧', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/1.png' },
            { name: '慈悲雲朵', desc: '溫柔覆蓋大地的善意', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/2.png' },
            { name: '脈輪光球', desc: '旋轉的能量核心', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/3.png' },
            { name: '般若卷軸', desc: '記載奧秘的古老靈魂', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/4.png' },
            { name: '須彌山獸', desc: '世界的中心，穩重如山', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/5.png' },
            { name: '金剛鑽狼', desc: '斬斷煩惱的銳利心性', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/6.png' },
            { name: '涅槃鳳凰', desc: '超越生死的終極自在', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/7.png' },
            { name: '真如星靈', desc: '接受當下的原本樣貌', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/8.png' },
            { name: '頓悟雷光', desc: '劃破無明的覺醒瞬間', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/9.png' },
            { name: '萬法歸一', desc: '宇宙萬物，本自一體', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/10.png' }
        ];

        function validateForm() {
            const mins = parseInt(document.getElementById('minutes').value) || 0;
            const note = document.getElementById('note').value.trim();
            const btn = document.getElementById('saveBtn');
            const icon = document.getElementById('btnIcon');
            if (mins >= 10 && note.length > 0) {
                btn.disabled = false; btn.classList.remove('btn-disabled'); icon.innerText = '💠';
            } else {
                btn.disabled = true; btn.classList.add('btn-disabled'); icon.innerText = '🔒';
            }
        }

        function saveRecord() {
            // 這裡模擬 Supabase 儲存成功後顯示結果
            const wonSpirit = spiritPool[Math.floor(Math.random() * spiritPool.length)];
            document.getElementById('gachaImg').src = wonSpirit.img;
            document.getElementById('gachaName').innerText = wonSpirit.name;
            document.getElementById('gachaDesc').innerText = wonSpirit.desc;
            document.getElementById('gachaModal').classList.remove('hidden');
            updateUI(); // 重新渲染月曆與天數
        }

        function closeGacha() {
            document.getElementById('gachaModal').classList.add('hidden');
            // 清空輸入
            document.getElementById('minutes').value = '';
            document.getElementById('note').value = '';
            validateForm();
        }

        function updateUI() {
            // 這裡放您原本的 renderCalendar, updateStreak 等函數
            document.getElementById('streakDisplay').innerText = "🔥 連續調頻 3 天 | 能量狀態極佳！"; 
            document.getElementById('calendarMonth').innerText = "2024年 5月 紀錄月曆";
        }

        // 初始化
        document.getElementById('recordDate').valueAsDate = new Date();
        updateUI();
    </script>
</body>
</html>
