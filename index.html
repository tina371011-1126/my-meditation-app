<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禪定精靈 - 完整終極版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: linear-gradient(to bottom, #082f49, #0f172a); color: #e0f2fe; font-family: 'PingFang TC', sans-serif; overflow-x: hidden; }
        .glass-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border-radius: 24px; border: 1px solid rgba(56, 189, 248, 0.2); }
        .calendar-dot { width: 8px; height: 8px; border-radius: 50%; margin: 2px auto; }
        .dot-filled { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
        .dot-empty { border: 1px solid rgba(56, 189, 248, 0.4); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .btn-gradient { background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%); }
        .btn-disabled { background: #334155 !important; opacity: 0.5; cursor: not-allowed; }
        
        /* 召喚動畫 */
        @keyframes super-shake {
            0% { transform: scale(1); }
            50% { transform: scale(1.2) rotate(5deg); }
            100% { transform: scale(1.4); opacity: 0; }
        }
        .crystal-active { animation: super-shake 1.5s forwards; }
        #particleCanvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 250; }
    </style>
</head>
<body class="min-h-screen p-4 pb-24">

    <canvas id="particleCanvas"></canvas>

    <div id="summoningOverlay" class="fixed inset-0 z-[200] flex flex-col items-center justify-center bg-black/95 backdrop-blur-2xl hidden">
        <div id="mainBall" class="w-32 h-32 rounded-full bg-gradient-to-br from-sky-300 to-blue-600 shadow-[0_0_50px_#3b82f6] flex items-center justify-center relative">
            <span class="text-5xl animate-pulse">🔮</span>
        </div>
        <p id="summonText" class="mt-12 text-gold font-bold tracking-[0.4em] animate-pulse text-lg">能量共鳴中...</p>
    </div>

    <div id="loginOverlay" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 px-6 hidden">
        <div class="glass-card p-8 w-full max-w-sm text-center">
            <h2 class="text-2xl font-black text-sky-300 mb-6">🧞 禪定精靈顯現</h2>
            <button onclick="handleGoogleLogin()" class="w-full bg-white text-black py-4 rounded-2xl font-bold flex items-center justify-center gap-2">
                Google 帳號連結
            </button>
        </div>
    </div>

    <div id="gachaModal" class="fixed inset-0 z-[300] flex items-center justify-center hidden px-6">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-md"></div>
        <div class="relative glass-card p-8 w-full max-w-sm text-center border-2 border-gold">
            <h2 class="text-gold font-bold mb-4 text-xl tracking-widest">✨ 獲得新夥伴 ✨</h2>
            <img id="gachaImg" src="" class="w-32 h-32 mx-auto mb-6 object-contain drop-shadow-[0_0_15px_rgba(255,255,255,0.4)]">
            <div id="gachaName" class="text-2xl font-black text-white mb-2"></div>
            <p id="gachaDesc" class="text-xs text-sky-300 mb-8 italic"></p>
            <button onclick="closeGacha()" class="w-full btn-gradient text-white py-3 rounded-xl font-bold">收入圖鑑</button>
        </div>
    </div>

    <div class="max-w-md mx-auto space-y-6 pt-2">
        <header class="flex justify-between items-center py-2">
            <div>
                <h1 class="text-xl font-black text-sky-200 tracking-wider">禪定精靈調頻</h1>
                <p id="streakDisplay" class="text-[10px] text-gold font-bold mt-1">讀取能量中...</p>
            </div>
            <img id="userAvatar" src="" class="w-10 h-10 rounded-full border-2 border-sky-500/50 cursor-pointer" onclick="logout()">
        </header>

        <div class="glass-card p-5">
            <h2 id="calendarMonth" class="text-center text-sm font-bold mb-4 text-sky-200 border-b border-sky-800/50 pb-2">精靈紀錄</h2>
            <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center"></div>
        </div>

        <div id="personalSection" class="hidden space-y-2">
            <h2 class="font-bold text-sky-200 text-sm ml-2 flex items-center gap-2">
                <span class="w-2 h-2 bg-gold rounded-full animate-pulse"></span> 
                <span>🍃 我的專屬禪定時光 (左右滑動)</span>
            </h2>
            <div id="personalSlider" class="flex gap-3 overflow-x-auto pb-2 hide-scrollbar snap-x px-1"></div>
        </div>

        <div class="glass-card p-6 space-y-4">
            <h2 class="font-bold text-sky-200 text-sm border-b border-sky-800/50 pb-2">🧘 禪定打卡</h2>
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[10px] text-sky-400">調頻時空 (可補打卡)</label>
                    <input type="date" id="recordDate" class="w-full p-2.5 text-xs rounded-xl bg-sky-900/40 border border-sky-700/50 text-white outline-none">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] text-sky-400">分鐘數</label>
                    <input type="number" id="minutes" oninput="validateForm()" placeholder="至少10分鐘" class="w-full p-2.5 text-xs rounded-xl bg-sky-900/40 border border-sky-700/50 text-white outline-none">
                </div>
            </div>
            <textarea id="note" oninput="validateForm()" placeholder="記錄此刻的禪定心得..." class="w-full p-3 text-xs h-20 rounded-xl bg-sky-900/40 border border-sky-700/50 text-white outline-none resize-none"></textarea>
            
            <button id="saveBtn" onclick="triggerSummon()" disabled class="w-full btn-gradient btn-disabled py-4 rounded-xl font-bold text-white shadow-lg flex items-center justify-center gap-2 active:scale-95">
                <span>匯聚能量 ‧ 召喚精靈</span>
                <span id="btnIcon">🔒</span>
            </button>
        </div>

        <div class="glass-card p-5">
            <h2 class="font-bold mb-4 text-sm text-sky-300 flex justify-between items-center">
                <span>📚 精靈圖鑑</span>
                <span id="collectionCount" class="text-[10px] bg-sky-900 px-2 py-1 rounded text-gold">0/20</span>
            </h2>
            <div id="spiritGrid" class="grid grid-cols-4 gap-3"></div>
        </div>

        <div class="glass-card p-5">
            <h2 class="font-bold mb-3 text-sky-200 text-sm border-b border-sky-800/50 pb-2">🏆 禪定能量排行</h2>
            <div id="leaderboard" class="space-y-2"></div>
        </div>

        <div class="glass-card p-5">
            <h2 class="font-bold mb-3 text-sky-200 text-sm border-b border-sky-800/50 pb-2">📖 夥伴禪定手札</h2>
            <div id="historyLogs" class="space-y-4 max-h-80 overflow-y-auto pr-2"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://szzpoyluooexmshcmpmk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tsVcpheph5XujUP9CGPRwA_pMlGNpb3';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const spiritPool = [
            { name: '初心苔蘚', desc: '柔軟且謙卑的初發心', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/1.png' },
            { name: '數息小童', desc: '專注呼吸的靈體', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/2.png' },
            { name: '不倒翁念頭', desc: '念頭來去，我自歸中', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/3.png' },
            { name: '止語貝殼', desc: '收藏著宇宙的寂靜', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/4.png' },
            { name: '公案青蛙', desc: '跳進水裡的頓悟聲', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/5.png' }
        ];

        let currentUser = "";
        let logsData = [];

        async function init() {
            document.getElementById('recordDate').valueAsDate = new Date();
            const { data: { session } } = await client.auth.getSession();
            updateAuth(session);
            client.auth.onAuthStateChange((_e, session) => updateAuth(session));
            initParticleCanvas();
        }

        function updateAuth(session) {
            const overlay = document.getElementById('loginOverlay');
            if (session) {
                overlay.classList.add('hidden');
                currentUser = session.user.user_metadata.full_name || "修行者";
                document.getElementById('userAvatar').src = session.user.user_metadata.avatar_url;
                fetchData();
            } else { overlay.classList.remove('hidden'); }
        }

        async function handleGoogleLogin() { await client.auth.signInWithOAuth({ provider: 'google' }); }
        function logout() { if(confirm('要暫時登出嗎？')) client.auth.signOut().then(()=>location.reload()); }

        async function fetchData() {
            const { data } = await client.from('meditation_logs').select('*').order('created_at', { ascending: false });
            logsData = data || [];
            renderAll();
        }

        function renderAll() {
            renderCalendar();
            renderPersonalSlider();
            renderInventory();
            renderLeaderboard();
            renderLogs();
            updateStreak();
        }

        function validateForm() {
            const mins = parseInt(document.getElementById('minutes').value) || 0;
            const note = document.getElementById('note').value.trim();
            const btn = document.getElementById('saveBtn');
            const icon = document.getElementById('btnIcon');
            if (mins >= 10 && note.length > 0) {
                btn.disabled = false; btn.classList.remove('btn-disabled'); icon.innerText = '💠';
            } else {
                btn.disabled = true; btn.classList.add('btn-disabled'); icon.innerText = '🔒';
            }
        }

        // 召喚與爆炸邏輯
        function triggerSummon() {
            const overlay = document.getElementById('summoningOverlay');
            overlay.classList.remove('hidden');
            document.getElementById('mainBall').classList.add('crystal-active');
            
            setTimeout(() => {
                createExplosion(window.innerWidth/2, window.innerHeight/2);
                overlay.classList.add('hidden');
                document.getElementById('mainBall').classList.remove('crystal-active');
                saveRecord();
            }, 1500);
        }

        async function saveRecord() {
            const mins = document.getElementById('minutes').value;
            const note = document.getElementById('note').value;
            const date = document.getElementById('recordDate').value;
            const spirit = spiritPool[Math.floor(Math.random()*spiritPool.length)];
            const finalNote = `${note} {{Spirit:${spirit.name}}}`;

            const { error } = await client.from('meditation_logs').insert([{ 
                username: currentUser, minutes: mins, note: finalNote, created_at: new Date(date).toISOString() 
            }]);

            if (!error) {
                document.getElementById('gachaImg').src = spirit.img;
                document.getElementById('gachaName').innerText = spirit.name;
                document.getElementById('gachaDesc').innerText = spirit.desc;
                document.getElementById('gachaModal').classList.remove('hidden');
                fetchData();
            }
        }

        function closeGacha() {
            document.getElementById('gachaModal').classList.add('hidden');
            document.getElementById('minutes').value = '';
            document.getElementById('note').value = '';
            validateForm();
        }

        // 渲染功能
        function renderCalendar() {
            const grid = document.getElementById('calendarGrid'); grid.innerHTML = "";
            const now = new Date();
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            const myLogs = logsData.filter(l => l.username === currentUser).map(l => new Date(l.created_at).getDate());
            for (let i = 1; i <= daysInMonth; i++) {
                const filled = myLogs.includes(i);
                grid.innerHTML += `<div><div class="text-[8px] ${filled ? 'text-gold font-bold' : 'text-sky-700'}">${i}</div><div class="calendar-dot ${filled ? 'dot-filled' : 'dot-empty'}"></div></div>`;
            }
        }

        function renderPersonalSlider() {
            const myLogs = logsData.filter(l => l.username === currentUser);
            const section = document.getElementById('personalSection');
            const slider = document.getElementById('personalSlider');
            if (myLogs.length) {
                section.classList.remove('hidden');
                slider.innerHTML = myLogs.map(l => {
                    const cleanNote = l.note.replace(/{{Spirit:.*?}}/g, '');
                    return `<div class="snap-center shrink-0 w-60 glass-card p-4 border border-sky-700/50">
                        <div class="text-gold font-bold text-[10px] mb-1">${new Date(l.created_at).toLocaleDateString()}</div>
                        <div class="text-[11px] text-sky-200 italic line-clamp-3">"${cleanNote}"</div>
                    </div>`;
                }).join('');
            }
        }

        function renderInventory() {
            const myLogs = logsData.filter(l => l.username === currentUser);
            const counts = {};
            myLogs.forEach(l => { const m = l.note.match(/{{Spirit:(.*?)}}/); if(m) counts[m[1]] = (counts[m[1]]||0)+1; });
            const keys = Object.keys(counts);
            document.getElementById('collectionCount').innerText = `${keys.length}/20`;
            document.getElementById('spiritGrid').innerHTML = keys.map(name => {
                const s = spiritPool.find(p => p.name === name) || {img:''};
                return `<div class="bg-sky-900/40 p-2 rounded-xl text-center border border-sky-700/30">
                    <img src="${s.img}" class="w-8 h-8 mx-auto object-contain">
                    <div class="text-[8px] font-bold text-sky-200 mt-1">${name} x${counts[name]}</div>
                </div>`;
            }).join('');
        }

        function renderLeaderboard() {
            const stats = {};
            logsData.forEach(l => stats[l.username] = (stats[l.username] || 0) + l.minutes);
            const sorted = Object.entries(stats).sort((a,b) => b[1]-a[1]);
            document.getElementById('leaderboard').innerHTML = sorted.slice(0, 5).map(([n, m], i) => 
                `<div class="flex justify-between p-2.5 ${n===currentUser?'bg-sky-800/60 border border-gold/30':'bg-sky-900/30'} rounded-xl text-xs">
                    <span>${i+1}. ${n}</span><span class="text-sky-400 font-mono">${m} min</span>
                </div>`
            ).join('');
        }

        function renderLogs() {
            document.getElementById('historyLogs').innerHTML = logsData.map(l => {
                const cleanNote = l.note.replace(/{{Spirit:.*?}}/g, ''); // 隱藏精靈資訊
                return `<div class="border-b border-sky-800/30 pb-3 last:border-0">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-xs font-bold text-sky-200">${l.username}</span>
                        <span class="text-[9px] text-sky-500">${new Date(l.created_at).toLocaleDateString()} · ${l.minutes}m</span>
                    </div>
                    <div class="text-[11px] text-sky-100/70 leading-relaxed bg-sky-900/20 p-2 rounded-lg italic">"${cleanNote}"</div>
                </div>`;
            }).join('');
        }

        function updateStreak() {
            const myLogs = logsData.filter(l => l.username === currentUser);
            const dates = [...new Set(myLogs.map(l => new Date(l.created_at).toDateString()))];
            let streak = 0; let check = new Date();
            if (dates[0] !== check.toDateString()) check.setDate(check.getDate() - 1);
            while (dates.includes(check.toDateString())) { streak++; check.setDate(check.getDate() - 1); }
            document.getElementById('streakDisplay').innerText = `🔥 連續調頻 ${streak} 天 | 能量即時連動中`;
        }

        // --- 粒子特效 Canvas ---
        let canvas, ctx, particles = [];
        function initParticleCanvas() {
            canvas = document.getElementById('particleCanvas');
            ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        }
        class Particle {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.size = Math.random() * 4 + 1;
                this.speedX = (Math.random() - 0.5) * 12;
                this.speedY = (Math.random() - 0.5) * 12;
                this.color = '#fbbf24'; this.opacity = 1;
            }
            update() { this.x += this.speedX; this.y += this.speedY; this.opacity -= 0.02; }
            draw() { ctx.globalAlpha = this.opacity; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); }
        }
        function createExplosion(x, y) {
            for(let i=0; i<40; i++) particles.push(new Particle(x, y));
            animate();
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = particles.filter(p => p.opacity > 0);
            particles.forEach(p => { p.update(); p.draw(); });
            if (particles.length) requestAnimationFrame(animate);
        }

        init();
    </script>
</body>
</html>
