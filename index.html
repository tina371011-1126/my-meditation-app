<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奧秘靈視 - 月相禪定系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        zen: { 900: '#0c4a6e', 950: '#082f49' },
                        gold: '#fbbf24'
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background: linear-gradient(to bottom, #082f49, #0f172a);
            background-attachment: fixed;
            color: #e0f2fe;
            font-family: 'PingFang TC', sans-serif; 
        }
        .glass-card { 
            background: rgba(15, 23, 42, 0.8); 
            backdrop-filter: blur(12px);
            border-radius: 24px; 
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .calendar-dot { width: 8px; height: 8px; border-radius: 50%; margin: 2px auto; }
        .dot-filled { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
        .dot-empty { border: 1px solid rgba(56, 189, 248, 0.4); }
        .btn-gradient { background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%); }
    </style>
</head>
<body class="min-h-screen p-4 pb-24">

    <div id="loginOverlay" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-md px-6 hidden">
        <div class="glass-card p-8 w-full max-w-sm text-center">
            <h2 class="text-3xl font-black text-sky-300 mb-4">🌌 奧秘靈視</h2>
            <button onclick="handleGoogleLogin()" class="w-full bg-white text-zen-950 py-4 rounded-2xl font-bold flex items-center justify-center gap-2">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-6 h-6"> Google 帳號連結
            </button>
        </div>
    </div>

    <div id="gachaModal" class="fixed inset-0 z-[70] flex items-center justify-center hidden px-6">
        <div class="absolute inset-0 bg-black/95"></div>
        <div id="resultPhase" class="relative glass-card p-8 w-full max-w-sm text-center border-2 border-gold">
            <h2 class="text-gold font-bold mb-4">✨ 奧秘顯現</h2>
            <img id="gachaImg" src="" class="w-32 h-32 mx-auto mb-4 animate-pulse">
            <div id="gachaName" class="text-2xl font-black mb-1"></div>
            <p id="gachaDesc" class="text-xs text-sky-300 mb-6 italic"></p>
            <button onclick="closeGacha()" class="w-full btn-gradient py-3 rounded-xl font-bold">收入圖鑑</button>
        </div>
    </div>

    <div class="max-w-md mx-auto space-y-6">
        <header class="flex justify-between items-center py-2">
            <div>
                <h1 class="text-xl font-black text-sky-300">奧秘靈視調頻</h1>
                <p id="streakDisplay" class="text-[10px] text-gold font-bold"></p>
            </div>
            <div class="group relative">
                <img id="userAvatar" src="" class="w-10 h-10 rounded-full border-2 border-sky-400 cursor-pointer">
                <div class="absolute right-0 top-12 hidden group-hover:block glass-card p-2 z-50">
                    <button onclick="logout()" class="text-xs text-red-400 font-bold whitespace-nowrap px-4 py-2">中斷連結 (登出)</button>
                </div>
            </div>
        </header>

        <div class="glass-card p-4">
            <h2 id="calendarMonth" class="text-center text-sm font-bold mb-4 text-sky-200"></h2>
            <div class="grid grid-cols-7 gap-1 text-center text-[10px] text-sky-500 mb-2">
                <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
            </div>
            <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center"></div>
        </div>

        <div class="glass-card p-6 space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[10px] text-sky-400 ml-1">調頻時空 (可補打卡)</label>
                    <input type="date" id="recordDate" class="w-full p-2 text-xs rounded-lg bg-sky-900/50 border border-sky-700 outline-none">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] text-sky-400 ml-1">分鐘數</label>
                    <input type="number" id="minutes" placeholder="20" class="w-full p-2 text-xs rounded-lg bg-sky-900/50 border border-sky-700 outline-none">
                </div>
            </div>
            <textarea id="note" placeholder="記錄此刻的心靈波動..." class="w-full p-3 text-xs h-16 rounded-lg bg-sky-900/50 border border-sky-700 outline-none"></textarea>
            <button onclick="saveRecord()" class="w-full btn-gradient py-3 rounded-xl font-bold shadow-lg active:scale-95">匯聚奧秘 ‧ 召喚精靈</button>
        </div>

        <div class="glass-card p-5">
            <h2 class="font-bold mb-4 text-sm text-sky-300">📚 已喚醒的奧秘</h2>
            <div id="spiritGrid" class="grid grid-cols-4 gap-4"></div>
            <div id="emptyTip" class="text-center text-xs text-sky-600 py-4 hidden">尚未有精靈回應你的召喚...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://szzpoyluooexmshcmpmk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tsVcpheph5XujUP9CGPRwA_pMlGNpb3';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const spiritPool = [
            { name: '初心苔蘚', desc: '柔軟且謙卑的初發心', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/1.png' },
            { name: '數息小童', desc: '專注呼吸的靈體', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/2.png' },
            { name: '不倒翁念頭', desc: '念頭來去，我自歸中', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/3.png' },
            { name: '止語貝殼', desc: '收藏著宇宙的寂靜', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/4.png' },
            { name: '公案青蛙', desc: '跳進水裡的頓悟聲', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/5.png' },
            { name: '定心石怪', desc: '如如不動，堅若磐石', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/6.png' },
            { name: '香燃煙靈', desc: '隨風而逝的無常', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/7.png' },
            { name: '木魚響響', desc: '清醒的節奏精靈', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/8.png' },
            { name: '蓮座花精', desc: '純淨的心靈花朵', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/9.png' },
            { name: '虛空水母', desc: '漂浮在空性之海', img: 'https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/10.png' }
            // ... 可自行補足至 20 隻
        ];

        let currentUser = "";
        let logsData = [];

        async function init() {
            document.getElementById('recordDate').valueAsDate = new Date();
            const { data: { session } } = await client.auth.getSession();
            updateAuth(session);
            client.auth.onAuthStateChange((_e, session) => updateAuth(session));
        }

        function updateAuth(session) {
            const overlay = document.getElementById('loginOverlay');
            if (session) {
                overlay.classList.add('hidden');
                currentUser = session.user.user_metadata.full_name || session.user.email.split('@')[0];
                document.getElementById('userAvatar').src = session.user.user_metadata.avatar_url;
                fetchData();
            } else {
                overlay.classList.remove('hidden');
            }
        }

        async function handleGoogleLogin() {
            await client.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin } });
        }

        async function logout() {
            await client.auth.signOut();
            location.reload();
        }

        async function fetchData() {
            const { data, error } = await client.from('meditation_logs').select('*').eq('username', currentUser).order('created_at', { ascending: false });
            if (error) return;
            logsData = data;
            renderAll();
        }

        function renderAll() {
            renderCalendar();
            renderInventory();
            calculateStreak();
        }

        function renderCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            document.getElementById('calendarMonth').innerText = `${year}年 ${month + 1}月 月相圖`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = "";

            // 填充空格
            for (let i = 0; i < firstDay; i++) grid.innerHTML += '<div></div>';

            // 取得本月打卡日期清單 (YYYY-MM-DD)
            const recordDates = logsData.map(l => {
                const d = new Date(l.created_at);
                return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            });

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                const isFilled = recordDates.includes(dateStr);
                grid.innerHTML += `
                    <div class="py-1">
                        <div class="text-[8px] text-sky-700">${day}</div>
                        <div class="calendar-dot ${isFilled ? 'dot-filled' : 'dot-empty'}"></div>
                    </div>
                `;
            }
        }

        function renderInventory() {
            const inventory = {};
            logsData.forEach(l => {
                const match = l.note.match(/{{Spirit:(.*?)}}/);
                if (match) inventory[match[1]] = (inventory[match[1]] || 0) + 1;
            });

            const grid = document.getElementById('spiritGrid');
            const spiritNames = Object.keys(inventory);
            grid.innerHTML = spiritNames.map(name => {
                const s = spiritPool.find(p => p.name === name) || { img: '', desc: '' };
                return `
                    <div class="flex flex-col items-center text-center">
                        <div class="relative bg-sky-900/40 p-2 rounded-xl border border-sky-700">
                            <img src="${s.img}" class="w-10 h-10 object-contain">
                            <span class="absolute -top-2 -right-2 bg-gold text-black text-[8px] font-bold px-1 rounded-full">x${inventory[name]}</span>
                        </div>
                        <span class="text-[8px] mt-1 font-bold text-sky-200">${name}</span>
                    </div>
                `;
            }).join('');
            
            document.getElementById('emptyTip').classList.toggle('hidden', spiritNames.length > 0);
        }

        function calculateStreak() {
            if (logsData.length === 0) return;
            const dates = [...new Set(logsData.map(l => new Date(l.created_at).toDateString()))];
            let streak = 0;
            let checkDate = new Date();
            
            // 如果今天沒打，從昨天開始算，否則從今天開始算
            if (dates[0] !== checkDate.toDateString()) {
                checkDate.setDate(checkDate.getDate() - 1);
            }

            for (let i = 0; i < dates.length; i++) {
                if (dates.includes(checkDate.toDateString())) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else {
                    break;
                }
            }

            const cheers = [
                "初試啼聲，奧秘正在萌芽 🌱",
                "穩步共鳴，靈視愈發清晰 ✨",
                "持之以恆，你正在與宇宙同頻 🌌",
                "不可思議，你的靈魂散發著恆星之光 🌟"
            ];
            const cheer = streak > 7 ? cheers[3] : streak > 3 ? cheers[2] : streak > 1 ? cheers[1] : cheers[0];
            document.getElementById('streakDisplay').innerText = `🔥 連續調頻 ${streak} 天 | ${cheer}`;
        }

        async function saveRecord() {
            const mins = parseInt(document.getElementById('minutes').value);
            const rawNote = document.getElementById('note').value.trim();
            const pickDate = document.getElementById('recordDate').value;

            if (!mins || mins < 10 || !rawNote) return alert("請輸入完整紀錄（至少10分鐘）");

            const wonSpirit = spiritPool[Math.floor(Math.random() * spiritPool.length)];
            const finalNote = `${rawNote} {{Spirit:${wonSpirit.name}}}`;

            // 建立一筆帶有指定日期的紀錄
            const { error } = await client.from('meditation_logs').insert([
                { username: currentUser, minutes: mins, note: finalNote, created_at: new Date(pickDate).toISOString() }
            ]);

            if (!error) {
                document.getElementById('gachaImg').src = wonSpirit.img;
                document.getElementById('gachaName').innerText = wonSpirit.name;
                document.getElementById('gachaDesc').innerText = wonSpirit.desc;
                document.getElementById('gachaModal').classList.remove('hidden');
                fetchData();
            } else {
                alert("傳輸失敗：" + error.message);
            }
        }

        function closeGacha() { document.getElementById('gachaModal').classList.add('hidden'); }

        init();
    </script>
</body>
</html>
