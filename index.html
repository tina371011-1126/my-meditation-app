<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寒假禪定打卡平台 - 進化通知版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0ea5e9; --accent: #7dd3fc; --bg-gradient: linear-gradient(135deg, #075985 0%, #0369a1 40%, #0c4a6e 100%); }
        body { background: var(--bg-gradient); background-attachment: fixed; color: #f0f9ff; font-family: 'PingFang TC', sans-serif; }
        .card { background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #38bdf8, #818cf8); transition: width 1s ease-in-out; }
        input, textarea { background: rgba(255, 255, 255, 0.1) !important; color: white !important; border: 1px solid rgba(255, 255, 255, 0.2) !important; border-radius: 16px !important; }
        .history-item { border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 1rem; }
    </style>
</head>
<body class="min-h-screen p-4 pb-24">
    <audio id="bgMusic" loop preload="auto">
        <source src="https://cdn.pixabay.com/audio/2022/03/24/audio_73130c2c13.mp3" type="audio/mpeg">
    </audio>

    <div class="max-w-md mx-auto space-y-6">
        <header class="text-center py-6">
            <h1 class="text-3xl font-black tracking-widest text-white drop-shadow-lg">寒假禪定打卡平台</h1>
            <p class="text-xs text-sky-200 mt-2 opacity-80 italic">♫ 點擊螢幕開啟靜心旋律</p>
        </header>

        <div class="card p-6 text-center">
            <div id="rankDisplay" class="text-sm font-bold mb-3 text-sky-100 italic">連線中...</div>
            <div class="h-3 w-full bg-sky-900/40 rounded-full overflow-hidden border border-sky-400/20">
                <div id="progressBarFill" class="progress-fill" style="width: 0%"></div>
            </div>
        </div>

        <div class="card p-6 space-y-4">
            <input type="text" id="username" placeholder="你是誰～" class="w-full p-4 outline-none">
            <input type="number" id="minutes" placeholder="禪定幾分鐘？" class="w-full p-4 outline-none">
            <textarea id="note" placeholder="寫下修煉心得..." class="w-full p-4 outline-none h-24"></textarea>
            <button onclick="saveRecord()" class="w-full bg-sky-500 hover:bg-sky-400 text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition-all">送出紀錄，累積靈魂能量</button>
        </div>

        <div class="space-y-4">
            <h2 class="font-bold text-white text-lg ml-2 flex items-center gap-2">✨ 已覺醒靈獸</h2>
            <div id="unlockedGrid" class="grid grid-cols-3 gap-3"></div>
        </div>

        <div class="card p-6">
            <h2 class="font-bold mb-4 text-sky-100 border-b border-white/10 pb-2 flex justify-between">🏆 修行功德榜</h2>
            <div id="leaderboard" class="space-y-3 text-sm"></div>
        </div>

        <div class="card p-6">
            <h2 class="font-bold mb-4 text-sky-100 border-b border-white/10 pb-2">📖 修煉日誌</h2>
            <div id="historyLogs" class="space-y-4 max-h-96 overflow-y-auto pr-2 text-sm"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://szzpoyluooexmshcmpmk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tsVcpheph5XujUP9CGPRwA_pMlGNpb3';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const characters = [
            { name: '懶石頭', req: 0, img: 'https://cdn-icons-png.flaticon.com/512/2602/2602465.png' },
            { name: '雲朵雞', req: 100, img: 'https://cdn-icons-png.flaticon.com/512/2663/2663067.png' },
            { name: '綠毛蟲', req: 200, img: 'https://cdn-icons-png.flaticon.com/512/805/805404.png' },
            { name: '波波貓', req: 300, img: 'https://cdn-icons-png.flaticon.com/512/616/616430.png' },
            { name: '狐狸仙', req: 400, img: 'https://cdn-icons-png.flaticon.com/512/235/235880.png' },
            { name: '鹿角獸', req: 500, img: 'https://cdn-icons-png.flaticon.com/512/2219/2219774.png' },
            { name: '獨角鯨', req: 600, img: 'https://cdn-icons-png.flaticon.com/512/2040/2040510.png' },
            { name: '大白龍', req: 700, img: 'https://cdn-icons-png.flaticon.com/512/616/616606.png' },
            { name: '火鳳凰', req: 800, img: 'https://cdn-icons-png.flaticon.com/512/2026/2026462.png' },
            { name: '星系主', req: 900, img: 'https://cdn-icons-png.flaticon.com/512/2534/2534064.png' }
        ];

        let currentUserScores = {};

        const playMusic = () => {
            document.getElementById('bgMusic').play().catch(() => {});
            window.removeEventListener('click', playMusic);
        };
        window.addEventListener('click', playMusic);

        async function fetchData() {
            const { data: logs, error } = await client.from('meditation_logs').select('*').order('created_at', { ascending: false });
            if(error) return;

            currentUserScores = {};
            logs.forEach(l => currentUserScores[l.username] = (currentUserScores[l.username] || 0) + l.coins);
            updateUI(logs, currentUserScores);
        }

        function updateUI(logs, userScores) {
            const name = document.getElementById('username').value.trim();
            const myScore = userScores[name] || 0;

            // 排行榜
            const sorted = Object.entries(userScores).sort((a,b) => b[1]-a[1]);
            document.getElementById('leaderboard').innerHTML = sorted.slice(0, 10).map(([n, s], i) => `
                <div class="flex justify-between items-center bg-white/5 p-2 rounded-lg">
                    <span class="${n === name ? 'text-sky-300 font-bold' : ''}">${i+1}. ${n}</span>
                    <span class="font-mono text-sky-200">${s} 幣</span>
                </div>
            `).join('');

            // 進度條
            const next = characters.find(c => c.req > myScore) || characters[9];
            const prog = myScore >= 900 ? 100 : (myScore / next.req) * 100;
            document.getElementById('progressBarFill').style.width = prog + '%';
            document.getElementById('rankDisplay').innerHTML = name ? (myScore >= 900 ? `✨ 已達成最高進化` : `距離進化到 <b>${next.name}</b> 還差 ${next.req - myScore} 幣`) : "輸入名字連動雲端...";

            // 圖鑑
            const unlocked = characters.filter(c => myScore >= c.req);
            document.getElementById('unlockedGrid').innerHTML = unlocked.map(c => `
                <div class="card p-3 flex flex-col items-center bg-white/20 border-sky-300/50 animate-bounce">
                    <img src="${c.img}" class="w-10 h-10 mb-2">
                    <span class="text-[10px] font-bold text-white">${c.name}</span>
                </div>
            `).join('');

            // 日誌
            document.getElementById('historyLogs').innerHTML = logs.map(l => `
                <div class="history-item mt-4">
                    <div class="flex justify-between items-center font-bold text-sky-200"><span>${l.username}</span><span class="text-[10px] bg-sky-500/30 px-2 py-0.5 rounded text-white">${l.coins} 幣</span></div>
                    <p class="mt-2 text-white/90 italic bg-black/10 p-2 rounded-lg">"${l.note || '靜默修行中...'}"</p>
                </div>
            `).join('');
        }

        async function saveRecord() {
            const username = document.getElementById('username').value.trim();
            const minutes = parseInt(document.getElementById('minutes').value);
            const note = document.getElementById('note').value;
            if(!username || !minutes) return alert('請填寫完整資訊');

            // 1. 紀錄舊分數與舊等級
            const oldScore = currentUserScores[username] || 0;
            const oldLevelCount = characters.filter(c => oldScore >= c.req).length;

            let coins = 0;
            if (minutes >= 40) coins = 40;
            else if (minutes >= 30) coins = 20;
            else if (minutes >= 20) coins = 10;
            else return alert('修行時間不足 20 分鐘');

            const { error } = await client.from('meditation_logs').insert([{ username, minutes, note, coins }]);
            if(error) alert('連線失敗');
            else {
                // 2. 獲取新分數與新等級
                const newScore = oldScore + coins;
                const newLevelCount = characters.filter(c => newScore >= c.req).length;
                const newChar = characters[newLevelCount - 1];

                // 3. 判斷是否進化
                if (newLevelCount > oldLevelCount) {
                    alert(`🎊 恭喜！靈魂能量突破！\n\n你已成功覺醒為：【${newChar.name}】！\n繼續修煉，邁向更高境界。`);
                } else {
                    alert(`紀錄成功！獲得了 ${coins} 枚禪定幣。`);
                }

                document.getElementById('minutes').value = '';
                document.getElementById('note').value = '';
                fetchData();
            }
        }

        document.getElementById('username').addEventListener('input', fetchData);
        setInterval(fetchData, 8000);
        fetchData();
    </script>
</body>
</html>
