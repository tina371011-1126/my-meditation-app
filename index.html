<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禪定精靈 - 夥伴連結版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: linear-gradient(to bottom, #082f49, #0f172a); color: #e0f2fe; font-family: 'PingFang TC', sans-serif; }
        .glass-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border-radius: 24px; border: 1px solid rgba(56, 189, 248, 0.2); }
        .calendar-dot { width: 6px; height: 6px; border-radius: 50%; margin: 2px auto; }
        .dot-filled { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
        .dot-empty { border: 1px solid rgba(56, 189, 248, 0.3); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .btn-gradient { background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%); transition: all 0.3s ease; }
        .btn-disabled { background: #334155 !important; opacity: 0.5; cursor: not-allowed; pointer-events: none; }
        @keyframes crystal-summon { 0% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.2) rotate(10deg); filter: brightness(1.5); } 100% { transform: scale(1.5); opacity: 0; } }
        .crystal-active { animation: crystal-summon 1.2s forwards ease-in; }
        #particleCanvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 250; }
        /* 日期選擇器反灰樣式優化 */
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); }
    </style>
</head>
<body class="min-h-screen p-4 pb-24">
    <canvas id="particleCanvas"></canvas>

    <div id="summoningOverlay" class="fixed inset-0 z-[200] flex flex-col items-center justify-center bg-black/95 backdrop-blur-2xl hidden">
        <div id="mainBall" class="w-32 h-32 rounded-full bg-gradient-to-br from-sky-300 to-blue-600 shadow-[0_0_60px_#3b82f6] flex items-center justify-center">
            <span class="text-5xl">🔮</span>
        </div>
        <p class="mt-12 text-gold font-bold tracking-[0.4em] animate-pulse">正在感應禪定能量...</p>
    </div>

    <div id="gachaModal" class="fixed inset-0 z-[300] flex items-center justify-center hidden px-6">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-md"></div>
        <div class="relative glass-card p-8 w-full max-sm text-center border-2 border-gold shadow-2xl">
            <h2 class="text-gold font-bold mb-4 text-xl tracking-widest">✨ 禪定精靈現身 ✨</h2>
            <img id="gachaImg" src="" class="w-32 h-32 mx-auto mb-6 object-contain drop-shadow-[0_0_20px_rgba(251,191,36,0.6)]">
            <div id="gachaName" class="text-2xl font-black text-white mb-2"></div>
            <p id="gachaDesc" class="text-xs text-sky-300 mb-8 italic px-4 leading-relaxed"></p>
            <button onclick="closeGacha()" class="w-full btn-gradient text-white py-3.5 rounded-xl font-bold shadow-lg active:scale-95">收入圖鑑</button>
        </div>
    </div>

    <div class="max-w-md mx-auto space-y-6 pt-2">
        <header class="flex justify-between items-center py-2 px-1">
            <div>
                <h1 class="text-xl font-black text-sky-200 tracking-wider">禪定精靈調頻</h1>
                <p id="streakDisplay" class="text-[10px] text-gold font-bold mt-1">連結能量中...</p>
            </div>
            <div class="flex items-center gap-3">
                <img id="userAvatar" src="" class="w-10 h-10 rounded-full border-2 border-sky-500/50 cursor-pointer" onclick="logout()">
            </div>
        </header>

        <div class="glass-card p-5">
            <h2 class="text-center text-sm font-bold mb-4 text-sky-200 border-b border-sky-800/50 pb-2">禪定紀錄月曆</h2>
            <div class="grid grid-cols-7 gap-1 text-center text-[9px] text-sky-500 mb-2">
                <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
            </div>
            <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center"></div>
        </div>

        <div id="personalSection" class="hidden space-y-2">
            <h2 class="font-bold text-sky-200 text-sm ml-2 flex justify-between items-center">
                <span class="flex items-center gap-2">
                    <span class="w-2 h-2 bg-gold rounded-full animate-pulse"></span> 
                    <span id="selectedDateText">🍃 專屬紀錄</span>
                </span>
                <button onclick="hidePersonal()" class="text-[10px] text-sky-500 px-2">關閉 ✕</button>
            </h2>
            <div id="personalSlider" class="flex gap-3 overflow-x-auto pb-2 hide-scrollbar snap-x px-1"></div>
        </div>

        <div class="glass-card p-6 space-y-4">
            <h2 class="font-bold text-sky-200 text-sm border-b border-sky-800/50 pb-2 flex items-center gap-2">
                <span>🧘 進行禪定打卡</span>
            </h2>
            <div class="grid grid-cols-12 gap-6">
                <div class="col-span-7 space-y-1">
                    <label class="text-[10px] text-sky-400 ml-1">日期</label>
                    <input type="date" id="recordDate" class="w-full p-2.5 text-xs rounded-xl bg-sky-900/40 border border-sky-700/50 text-white outline-none">
                </div>
                <div class="col-span-5 space-y-1">
                    <label class="text-[10px] text-sky-400 ml-1">分鐘</label>
                    <input type="number" id="minutes" oninput="validateForm()" placeholder="需至少10分鐘" class="w-full p-2.5 text-xs rounded-xl bg-sky-900/40 border border-sky-700/50 text-white outline-none">
                </div>
            </div>
            <textarea id="note" oninput="validateForm()" placeholder="此刻的心得..." class="w-full p-3 text-xs h-20 rounded-xl bg-sky-900/40 border border-sky-700/50 text-white outline-none resize-none"></textarea>
            
            <button id="saveBtn" onclick="triggerSummon()" disabled class="w-full btn-gradient btn-disabled py-4 rounded-xl font-bold text-white shadow-lg flex items-center justify-center gap-2">
                <span>匯聚能量 ‧ 召喚精靈</span>
                <span id="btnIcon">🔒</span>
            </button>
        </div>

        <div class="glass-card p-5">
            <h2 class="font-bold mb-4 text-sm text-sky-300 flex justify-between items-center">
                <span>📚 已收集精靈</span>
                <span id="collectionCount" class="text-[10px] bg-sky-900 px-2 py-1 rounded text-gold">0/20</span>
            </h2>
            <div id="spiritGrid" class="grid grid-cols-4 gap-2"></div>
        </div>

        <div class="glass-card p-5">
            <h2 class="font-bold mb-3 text-sky-200 text-sm border-b border-sky-800/50 pb-2">🏆 禪定能量排行</h2>
            <div id="leaderboard" class="space-y-2"></div>
        </div>

        <div class="glass-card p-5">
            <h2 class="font-bold mb-3 text-sky-200 text-sm border-b border-sky-800/50 pb-2">📖 夥伴禪定手札</h2>
            <div id="historyLogs" class="space-y-4 max-h-80 overflow-y-auto pr-1"></div>
        </div>
    </div>

    <div id="loginOverlay" class="fixed inset-0 z-[500] flex items-center justify-center bg-black/95 px-6 hidden">
        <div class="glass-card p-8 w-full max-w-sm text-center">
            <h2 class="text-2xl font-black text-sky-300 mb-6 tracking-widest">🧞 禪定精靈</h2>
            <button onclick="handleGoogleLogin()" class="w-full bg-white text-black py-4 rounded-2xl font-bold">Google 帳號登入</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://szzpoyluooexmshcmpmk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tsVcpheph5XujUP9CGPRwA_pMlGNpb3';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const spiritPool = [
            { name: '初心苔蘚', desc: '柔軟且謙卑的初發心，是修行最珍貴的基石。', img: '1.png' },
            { name: '數息小童', desc: '專注呼吸的靈體，帶領你找回內心的節奏。', img: '2.png' },
            { name: '不倒翁念頭', desc: '念頭來去如風，我心自巋然不動。', img: '3.png' },
            { name: '止語貝殼', desc: '收藏著宇宙的寂靜，唯有沈默能聽見真理。', img: '4.png' },
            { name: '公案青蛙', desc: '跳進清澈的心湖，激起頓悟的水花。', img: '5.png' },
            { name: '定心石怪', desc: '如如不動，堅若磐石，無視外界的紛擾。', img: '6.png' },
            { name: '香燃煙靈', desc: '隨風而逝的煙霧，提醒生命無常的本質。', img: '7.png' },
            { name: '木魚響響', desc: '清醒的節奏，敲碎沈重的睡意與昏沈。', img: '8.png' },
            { name: '蓮座花精', desc: '出淤泥而不染，在混濁的世界綻放純淨。', img: '9.png' },
            { name: '虛空水母', desc: '漂浮在空性之海，感知萬物一體的連結。', img: '10.png' },
            { name: '觀照之眼', desc: '洞察真實的智慧，看穿一切幻象的本質。', img: '11.png' },
            { name: '慈悲雲朵', desc: '溫柔覆蓋大地的善意，化解心中的乾渴。', img: '12.png' },
            { name: '脈輪光球', desc: '旋轉的能量核心，平衡身心靈的微細調頻。', img: '13.png' },
            { name: '般若卷軸', desc: '記載奧秘的古老靈魂，承載著佛法的智慧。', img: '14.png' },
            { name: '須彌山獸', desc: '世界的中心，穩重如山，守護修行的初心。', img: '15.png' },
            { name: '金剛鑽狼', desc: '斬斷煩惱的銳利心性，剛強而充滿行動力。', img: '16.png' },
            { name: '涅槃鳳凰', desc: '超越生死的終極自在，在寂靜中獲得新生。', img: '17.png' },
            { name: '真如星靈', desc: '接受當下的原本樣貌，綻放每個人自有的光芒。', img: '18.png' },
            { name: '頓悟雷光', desc: '劃破無明的覺醒瞬間，在一剎那間照亮世界。', img: '19.png' },
            { name: '萬法歸一', desc: '宇宙萬物，本自一體，回歸最初的純粹。', img: '20.png' }
        ];

        const getImgUrl = (fileName) => `https://raw.githubusercontent.com/tina371011-1126/my-spirit-assets/refs/heads/main/${fileName}`;
        let currentUser = "";
        let logsData = [];

        async function init() {
            // 設定今日日期與最大日期限制（明天以後反灰）
            const today = new Date();
            const dateStr = today.toISOString().split('T')[0];
            const dateInput = document.getElementById('recordDate');
            dateInput.value = dateStr;
            dateInput.max = dateStr; 

            const { data: { session } } = await client.auth.getSession();
            updateAuth(session);
            client.auth.onAuthStateChange((_e, session) => updateAuth(session));
            initParticles();
        }

        function updateAuth(session) {
            const overlay = document.getElementById('loginOverlay');
            if (session) {
                overlay.classList.add('hidden');
                currentUser = session.user.user_metadata.full_name || "禪定勇者";
                document.getElementById('userAvatar').src = session.user.user_metadata.avatar_url;
                const urlParams = new URLSearchParams(window.location.search);
                if(urlParams.get('remind') === currentUser) {
                    setTimeout(() => alert(`🔔 夥伴呼喚：${currentUser}，今日能量尚未對齊，快來禪定吧！`), 1000);
                }
                fetchData();
            } else { overlay.classList.remove('hidden'); }
        }

        async function handleGoogleLogin() { await client.auth.signInWithOAuth({ provider: 'google' }); }
        function logout() { if(confirm('確定要登出嗎？')) client.auth.signOut().then(()=>location.reload()); }

        async function fetchData() {
            const { data, error } = await client.from('meditation_logs').select('*').order('created_at', { ascending: false });
            if (error) console.error(error);
            logsData = data || [];
            renderAll();
        }

        function renderAll() { renderCalendar(); renderInventory(); renderLeaderboard(); renderLogs(); updateStreak(); }

        function triggerSummon() {
            const overlay = document.getElementById('summoningOverlay');
            overlay.classList.remove('hidden');
            document.getElementById('mainBall').classList.add('crystal-active');
            setTimeout(() => {
                createExplosion(window.innerWidth/2, window.innerHeight/2);
                overlay.classList.add('hidden');
                document.getElementById('mainBall').classList.remove('crystal-active');
                saveRecord(); 
            }, 1200);
        }

        async function saveRecord() {
            const mins = document.getElementById('minutes').value;
            const note = document.getElementById('note').value;
            const dateInput = document.getElementById('recordDate').value;
            const spirit = spiritPool[Math.floor(Math.random() * spiritPool.length)];
            const finalNote = `${note} {{Spirit:${spirit.name}}}`;
            const timestamp = new Date(dateInput);
            timestamp.setHours(new Date().getHours(), new Date().getMinutes());

            const { error } = await client.from('meditation_logs').insert([{ 
                username: currentUser, minutes: parseInt(mins), note: finalNote, created_at: timestamp.toISOString() 
            }]);

            if (!error) {
                document.getElementById('gachaImg').src = getImgUrl(spirit.img);
                document.getElementById('gachaName').innerText = spirit.name;
                document.getElementById('gachaDesc').innerText = spirit.desc;
                document.getElementById('gachaModal').classList.remove('hidden');
                await fetchData();
            } else { alert(`傳輸失敗：${error.message}`); }
        }

        function closeGacha() {
            document.getElementById('gachaModal').classList.add('hidden');
            document.getElementById('minutes').value = '';
            document.getElementById('note').value = '';
            validateForm();
        }

        function renderInventory() {
            const myLogs = logsData.filter(l => l.username === currentUser);
            const counts = {};
            myLogs.forEach(l => { const m = l.note.match(/{{Spirit:(.*?)}}/); if(m) counts[m[1]] = (counts[m[1]]||0)+1; });
            const collectedSpirits = spiritPool.filter(s => counts[s.name]);
            document.getElementById('collectionCount').innerText = `${collectedSpirits.length}/20`;
            document.getElementById('spiritGrid').innerHTML = collectedSpirits.map(s => `
                <div class="bg-sky-900/60 border-sky-400 p-2 rounded-lg text-center border animate-fade-in">
                    <img src="${getImgUrl(s.img)}" class="w-8 h-8 mx-auto object-contain">
                    <div class="text-[8px] text-sky-200 mt-1 truncate">${s.name}</div>
                    <div class="text-[8px] text-gold font-bold">x${counts[s.name]}</div>
                </div>`).join('');
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid'); grid.innerHTML = "";
            const now = new Date();
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
            for (let i = 0; i < firstDay; i++) grid.innerHTML += '<div></div>';
            const myLogs = logsData.filter(l => l.username === currentUser);
            for (let i = 1; i <= daysInMonth; i++) {
                const hasRecord = myLogs.some(l => new Date(l.created_at).getDate() === i);
                grid.innerHTML += `
                    <div onclick="showDayDetail(${i}, ${hasRecord})" class="cursor-pointer py-1.5 rounded-lg active:bg-sky-700/50">
                        <div class="text-[9px] ${hasRecord ? 'text-gold font-bold' : 'text-sky-800'}">${i}</div>
                        <div class="calendar-dot ${hasRecord ? 'dot-filled' : 'dot-empty'}"></div>
                    </div>`;
            }
        }

        function showDayDetail(day, hasRecord) {
            if (!hasRecord) { alert("這天偷懶囉！😴"); return; }
            const filtered = logsData.filter(l => l.username === currentUser && new Date(l.created_at).getDate() === day);
            const section = document.getElementById('personalSection');
            section.classList.remove('hidden');
            document.getElementById('selectedDateText').innerText = `🍃 ${day}日 的專屬紀錄`;
            document.getElementById('personalSlider').innerHTML = filtered.map(l => {
                const cleanNote = l.note.replace(/{{Spirit:.*?}}/g, '');
                return `
                <div class="snap-center shrink-0 w-64 glass-card p-4 border border-sky-600/30">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-sky-400 font-bold text-[10px]">禪定: ${l.minutes} 分鐘</span>
                        <div class="flex gap-2">
                            <button onclick="editLog(${l.id}, '${cleanNote}', ${l.minutes})" class="text-[10px] text-yellow-500">修改</button>
                            <button onclick="deleteLog(${l.id})" class="text-[10px] text-red-500">刪除</button>
                        </div>
                    </div>
                    <div class="text-[12px] text-sky-100 leading-relaxed italic">"${cleanNote}"</div>
                </div>`;
            }).join('');
            section.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        async function deleteLog(id) {
            if (confirm("能量將會消散... 確定要刪除這筆紀錄嗎？")) {
                const { error } = await client.from('meditation_logs').delete().eq('id', id);
                if (!error) { hidePersonal(); await fetchData(); }
            }
        }

        function editLog(id, note, mins) {
            document.getElementById('minutes').value = mins;
            document.getElementById('note').value = note;
            document.getElementById('saveBtn').setAttribute('onclick', `updateLog(${id})`);
            document.getElementById('saveBtn').innerText = "修正能量軌跡";
            validateForm();
            window.scrollTo({ top: document.getElementById('note').offsetTop - 100, behavior: 'smooth' });
        }

        async function updateLog(id) {
            const mins = document.getElementById('minutes').value;
            const note = document.getElementById('note').value;
            const { error } = await client.from('meditation_logs').update({ minutes: parseInt(mins), note: note }).eq('id', id);
            if (!error) {
                alert("能量修正成功！");
                document.getElementById('saveBtn').setAttribute('onclick', "triggerSummon()");
                document.getElementById('saveBtn').innerHTML = "<span>匯聚能量 ‧ 召喚精靈</span><span id='btnIcon'>💠</span>";
                document.getElementById('minutes').value = '';
                document.getElementById('note').value = '';
                hidePersonal();
                await fetchData();
            }
        }

        function remindPartner(targetName) {
            const baseUrl = window.location.href.split('?')[0];
            const remindUrl = `${baseUrl}?remind=${encodeURIComponent(targetName)}`;
            const text = encodeURIComponent(`🧘 禪定夥伴呼喚：${targetName}！\n今日尚未禪定，快回來對齊能量吧！✨\n點擊進入：${remindUrl}`);
            window.open(`https://line.me/R/msg/text/?${text}`);
        }

        function hidePersonal() { document.getElementById('personalSection').classList.add('hidden'); }
        function validateForm() {
            const mins = parseInt(document.getElementById('minutes').value) || 0;
            const note = document.getElementById('note').value.trim();
            const btn = document.getElementById('saveBtn');
            btn.disabled = !(mins >= 10 && note.length > 0);
            btn.classList.toggle('btn-disabled', btn.disabled);
            document.getElementById('btnIcon').innerText = btn.disabled ? '🔒' : '💠';
        }

        function renderLeaderboard() {
            const stats = {};
            logsData.forEach(l => stats[l.username] = (stats[l.username] || 0) + l.minutes);
            const sorted = Object.entries(stats).sort((a,b) => b[1]-a[1]);
            document.getElementById('leaderboard').innerHTML = sorted.slice(0, 5).map(([n, m], i) => 
                `<div class="flex justify-between items-center p-3 ${n===currentUser?'bg-sky-800/60 border border-gold/30':'bg-sky-900/30'} rounded-xl text-xs">
                    <div class="flex items-center gap-2">
                        <span>${i+1}. ${n}</span>
                        ${n !== currentUser ? `<button onclick="remindPartner('${n}')" class="text-[9px] bg-green-600 px-1.5 py-0.5 rounded text-white opacity-80">叮嚀</button>` : ''}
                    </div>
                    <span class="font-mono text-sky-400">${m} min</span>
                </div>`
            ).join('');
        }

        function renderLogs() {
            document.getElementById('historyLogs').innerHTML = logsData.map(l => {
                const cleanNote = l.note.replace(/{{Spirit:.*?}}/g, '');
                return `
                <div class="border-b border-sky-800/30 pb-3 last:border-0">
                    <div class="flex justify-between items-start mb-1">
                        <div>
                            <span class="text-xs font-bold text-sky-200">${l.username}</span>
                            <span class="ml-2 text-[10px] px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-400 font-mono">${l.minutes} min</span>
                        </div>
                        <span class="text-[9px] text-sky-600">${new Date(l.created_at).toLocaleDateString()}</span>
                    </div>
                    <div class="text-[11px] text-sky-100/70 italic leading-snug pl-1 border-l border-sky-700/50 mt-1">"${cleanNote}"</div>
                </div>`;
            }).join('');
        }
        function updateStreak() {
            const myLogs = logsData.filter(l => l.username === currentUser);
            const dates = [...new Set(myLogs.map(l => new Date(l.created_at).toDateString()))];
            let streak = 0; let check = new Date();
            if (dates[0] !== check.toDateString()) check.setDate(check.getDate() - 1);
            while (dates.includes(check.toDateString())) { streak++; check.setDate(check.getDate() - 1); }
            document.getElementById('streakDisplay').innerText = `🔥 已連續禪定 ${streak} 天 | 能量充盈`;
        }
        let canvas, ctx, particles = [];
        function initParticles() { canvas = document.getElementById('particleCanvas'); ctx = canvas.getContext('2d'); canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        class Particle { constructor(x, y) { this.x = x; this.y = y; this.size = Math.random()*5+2; this.speedX = (Math.random()-0.5)*15; this.speedY = (Math.random()-0.5)*15; this.opacity = 1; } update() { this.x += this.speedX; this.y += this.speedY; this.opacity -= 0.025; } draw() { ctx.globalAlpha = this.opacity; ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); } }
        function createExplosion(x, y) { for(let i=0; i<50; i++) particles.push(new Particle(x, y)); animateParticles(); }
        function animateParticles() { ctx.clearRect(0,0,canvas.width,canvas.height); particles = particles.filter(p => p.opacity > 0); particles.forEach(p => { p.update(); p.draw(); }); if(particles.length) requestAnimationFrame(animateParticles); }
        init();
    </script>
</body>
</html>
