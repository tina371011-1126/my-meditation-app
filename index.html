<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台科領寒假禪定打卡平台 - 森林美景版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            /* 更新背景圖為指定的森林美景圖 */
            background: url('https://png.pngtree.com/background/20210711/original/pngtree-cartoon-beautiful-forest-free-illustration-picture-image_1100065.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #064e3b; /* 極深綠色文字 */
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; 
        }

        /* 標題樣式：使用深綠色與白色光暈，確保在亮色背景中顯眼 */
        .title-gradient {
            color: #065f46;
            filter: drop-shadow(3px 3px 0px white);
        }

        .card { 
            background: rgba(255, 255, 255, 0.88); /* 稍微提高不透明度，提升閱讀舒適度 */
            backdrop-filter: blur(10px);
            border-radius: 28px; 
            border: 2px solid rgba(52, 211, 153, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .progress-fill { 
            height: 100%; 
            background: linear-gradient(90deg, #10b981, #059669); 
            transition: width 1s ease-in-out; 
        }

        input, textarea { 
            background: rgba(255, 255, 255, 0.95) !important; 
            color: #064e3b !important; 
            border: 1.5px solid #a7f3d0 !important;
            border-radius: 16px !important;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #10b981 !important;
            background: white !important;
        }

        .forest-text { color: #064e3b; text-decoration: none !important; }

        .history-item { border-bottom: 1px solid rgba(16, 185, 129, 0.15); padding-bottom: 1rem; }

        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .unlocked-pet { animation: gentle-bounce 2s infinite ease-in-out; }

        /* 自定義捲軸樣式 */
        #historyLogs::-webkit-scrollbar { width: 6px; }
        #historyLogs::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-4 pb-24">
    <audio id="bgMusic" loop preload="auto">
        <source src="https://cdn.pixabay.com/audio/2022/03/24/audio_73130c2c13.mp3" type="audio/mpeg">
    </audio>

    <div class="max-w-md mx-auto space-y-6">
        <header class="text-center py-6">
            <h1 class="text-3xl font-black tracking-widest title-gradient">台科領寒假禪定打卡平台</h1>
            <p class="text-xs text-emerald-800 mt-2 font-bold italic bg-white/60 inline-block px-4 py-1 rounded-full shadow-sm">♫ 沉澱好自己的心一起來填寫日記！</p>
        </header>

        <div class="card p-6 text-center">
            <div id="rankDisplay" class="text-sm font-bold mb-3 text-emerald-900 italic">森林能量收集紀錄...</div>
            <div class="h-4 w-full bg-emerald-100 rounded-full overflow-hidden border border-emerald-200 shadow-inner">
                <div id="progressBarFill" class="progress-fill" style="width: 0%"></div>
            </div>
            <div class="flex justify-between mt-2 text-[11px] text-emerald-800 font-bold">
                <span>🌱 初心萌芽</span><span>🌳 萬物合一</span>
            </div>
        </div>

        <div class="card p-6 space-y-4">
            <div class="space-y-1">
                <label class="text-xs font-bold text-emerald-900 ml-1">你是誰～</label>
                <input type="text" id="username" placeholder="輸入名字同步森林進度" class="w-full p-4 outline-none" oninput="startMusic(); fetchData();">
            </div>
            <div class="space-y-1">
                <label class="text-xs font-bold text-emerald-900 ml-1">禪定幾分鐘？</label>
                <input type="number" id="minutes" placeholder="建議 20 分鐘以上" class="w-full p-4 outline-none">
            </div>
            <div class="space-y-1">
                <label class="text-xs font-bold text-emerald-900 ml-1">此刻的心得日誌 (必填)</label>
                <textarea id="note" placeholder="記錄這段寧靜的時光..." class="w-full p-4 outline-none h-24"></textarea>
            </div>
            <button onclick="saveRecord()" class="w-full bg-gradient-to-r from-emerald-600 to-green-600 text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 hover:brightness-110 transition-all">送出紀錄，收集能量</button>
        </div>

        <div class="space-y-4">
            <h2 class="font-bold text-emerald-900 text-lg ml-2 flex items-center gap-2">✨ 已覺醒森林守護者</h2>
            <div id="unlockedGrid" class="grid grid-cols-3 gap-3"></div>
        </div>

        <div class="card p-6">
            <h2 class="font-bold mb-4 forest-text border-b border-emerald-200 pb-2 flex items-center gap-2">🏆 森林修煉榜</h2>
            <div id="leaderboard" class="space-y-3 text-sm forest-text"></div>
        </div>

        <div class="card p-6">
            <h2 class="font-bold mb-4 forest-text border-b border-emerald-200 pb-2 flex items-center gap-2">📖 勇者修煉日誌</h2>
            <div id="historyLogs" class="space-y-4 max-h-96 overflow-y-auto pr-2 text-sm forest-text"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://szzpoyluooexmshcmpmk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tsVcpheph5XujUP9CGPRwA_pMlGNpb3';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const characters = [
            { name: '懶石頭', req: 0, img: 'https://cdn-icons-png.flaticon.com/512/2602/2602465.png' },
            { name: '雲朵雞', req: 100, img: 'https://cdn-icons-png.flaticon.com/512/2663/2663067.png' },
            { name: '綠毛蟲', req: 200, img: 'https://cdn-icons-png.flaticon.com/512/805/805404.png' },
            { name: '波波貓', req: 300, img: 'https://cdn-icons-png.flaticon.com/512/616/616430.png' },
            { name: '狐狸仙', req: 400, img: 'https://cdn-icons-png.flaticon.com/512/235/235880.png' },
            { name: '鹿角獸', req: 500, img: 'https://cdn-icons-png.flaticon.com/512/2219/2219774.png' },
            { name: '獨角鯨', req: 600, img: 'https://cdn-icons-png.flaticon.com/512/2040/2040510.png' },
            { name: '大白龍', req: 700, img: 'https://cdn-icons-png.flaticon.com/512/616/616606.png' },
            { name: '火鳳凰', req: 800, img: 'https://cdn-icons-png.flaticon.com/512/2026/2026462.png' },
            { name: '星系主', req: 900, img: 'https://cdn-icons-png.flaticon.com/512/2534/2534064.png' }
        ];

        let cachedUserScores = {};
        let musicStarted = false;

        function startMusic() {
            if (!musicStarted) {
                document.getElementById('bgMusic').play().then(() => { musicStarted = true; }).catch(() => {});
            }
        }
        window.addEventListener('click', startMusic);

        async function fetchData() {
            const { data: logs, error } = await client.from('meditation_logs').select('*').order('created_at', { ascending: false });
            if(error) return;

            cachedUserScores = {};
            logs.forEach(l => {
                cachedUserScores[l.username] = (cachedUserScores[l.username] || 0) + l.coins;
            });
            updateUI(logs, cachedUserScores);
        }

        function updateUI(logs, userScores) {
            const name = document.getElementById('username').value.trim();
            const myScore = userScores[name] || 0;

            const sorted = Object.entries(userScores).sort((a,b) => b[1]-a[1]);
            document.getElementById('leaderboard').innerHTML = sorted.slice(0, 10).map(([n, s], i) => `
                <div class="flex justify-between p-2 bg-emerald-50/60 rounded-lg mb-1 border border-emerald-100 shadow-sm">
                    <span class="${n === name ? 'font-black text-emerald-700' : 'font-medium'}">${i+1}. ${n}</span>
                    <span class="font-bold text-emerald-600">${s} 幣</span>
                </div>
            `).join('') || '尚未有修行紀錄';

            const next = characters.find(c => c.req > myScore) || characters[9];
            const prog = myScore >= 900 ? 100 : (myScore / next.req) * 100;
            document.getElementById('progressBarFill').style.width = prog + '%';
            document.getElementById('rankDisplay').innerHTML = name ? 
                (myScore >= 900 ? `✨ 已覺醒為最高階：星系主` : `距離下次進化還差 ${next.req - myScore} 能量`) : "守護者身份同步中...";

            const unlocked = characters.filter(c => myScore >= c.req);
            document.getElementById('unlockedGrid').innerHTML = unlocked.map(c => `
                <div class="card p-3 flex flex-col items-center bg-white/95 border-emerald-200 unlocked-pet">
                    <img src="${c.img}" class="w-10 h-10 mb-2">
                    <span class="text-[10px] font-bold forest-text">${c.name}</span>
                </div>
            `).join('');

            document.getElementById('historyLogs').innerHTML = logs.map(l => {
                const date = new Date(l.created_at);
                const timeStr = `${date.getMonth()+1}/${date.getDate()} ${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
                return `
                    <div class="history-item mt-4">
                        <div class="flex justify-between items-center font-bold text-emerald-900">
                            <span>${l.username}</span><span>+${l.coins} 能量</span>
                        </div>
                        <p class="text-[10px] text-emerald-600 mb-1 font-mono">${timeStr}</p>
                        <p class="mt-1 bg-emerald-50/80 p-3 rounded-lg italic text-emerald-800 border border-emerald-100 shadow-sm">"${l.note}"</p>
                    </div>
                `;
            }).join('') || '森林目前很安靜，等待第一份日誌...';
        }

        async function saveRecord() {
            const username = document.getElementById('username').value.trim();
            const minutes = parseInt(document.getElementById('minutes').value);
            const note = document.getElementById('note').value.trim();
            if(!username || !minutes) return alert('請填寫完整資訊');
            if(!note) return alert('請寫下今日的修行心得！');

            const oldScore = cachedUserScores[username] || 0;
            const oldLevelCount = characters.filter(c => oldScore >= c.req).length;

            let coins = 0;
            if (minutes >= 40) coins = 40;
            else if (minutes >= 30) coins = 20;
            else if (minutes >= 20) coins = 10;
            else return alert('修行時間至少需滿 20 分鐘才可獲得能量。');

            const { error } = await client.from('meditation_logs').insert([{ username, minutes, note, coins }]);
            if(error) alert('儲存失敗，請檢查網路連線');
            else {
                const newScore = oldScore + coins;
                const newLevelCount = characters.filter(c => newScore >= c.req).length;
                if (newLevelCount > oldLevelCount) {
                    alert(`🎊 森林祝福！你已成功進化為：【${characters[newLevelCount-1].name}】！`);
                } else {
                    alert(`紀錄成功！您獲得了 ${coins} 點森林能量。`);
                }
                document.getElementById('minutes').value = '';
                document.getElementById('note').value = '';
                fetchData();
            }
        }
        setInterval(fetchData, 10000);
        fetchData();
    </script>
</body>
</html>
