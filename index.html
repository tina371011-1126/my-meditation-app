<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寒假禪定打卡平台 - 星空版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #8da399; --accent: #fcd34d; }
        /* 溫和星空漸層背景 */
        body { 
            background: linear-gradient(135deg, #1a1c2c 0%, #4a192c 50%, #121212 100%);
            background-attachment: fixed;
            color: #e2e8f0; 
            font-family: 'PingFang TC', sans-serif; 
        }
        .card { 
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(10px);
            border-radius: 28px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #8da399, #fcd34d); transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
        input, textarea { background: rgba(0, 0, 0, 0.2) !important; color: white !important; border: 1px solid rgba(255, 255, 255, 0.2) !important; }
        input::placeholder, textarea::placeholder { color: #94a3b8; }
    </style>
</head>
<body class="min-h-screen p-4 pb-20">
    <audio id="bgMusic" loop>
        <source src="https://cdn.pixabay.com/audio/2022/03/24/audio_73130c2c13.mp3" type="audio/mpeg">
    </audio>

    <div class="max-w-md mx-auto space-y-6">
        <header class="text-center py-6">
            <h1 class="text-2xl font-black tracking-[0.2em] text-transparent bg-clip-text bg-gradient-to-r from-teal-200 to-yellow-200">寒假禪定打卡平台</h1>
            <p class="text-xs text-slate-400 mt-2 italic">♫ 點擊頁面任何地方開啟靜心音樂</p>
        </header>

        <div class="card p-6">
            <div id="rankDisplay" class="text-sm font-bold mb-3 text-teal-200 text-center">輸入名字同步修行進度...</div>
            <div class="h-3 w-full bg-black/30 rounded-full overflow-hidden shadow-inner">
                <div id="progressBarFill" class="progress-fill" style="width: 0%"></div>
            </div>
            <div class="flex justify-between mt-2 text-[10px] text-slate-400">
                <span>初心理性</span>
                <span>宇宙覺醒</span>
            </div>
        </div>

        <div class="card p-6 space-y-4">
            <input type="text" id="username" placeholder="你是誰～(跨裝置同步用)" class="w-full p-4 rounded-2xl outline-none focus:ring-2 focus:ring-teal-500 transition-all">
            <input type="number" id="minutes" placeholder="今日禪定分鐘數" class="w-full p-4 rounded-2xl outline-none focus:ring-2 focus:ring-teal-500 transition-all">
            <textarea id="note" placeholder="此刻的心情是..." class="w-full p-4 rounded-2xl outline-none focus:ring-2 focus:ring-teal-500 transition-all h-20"></textarea>
            <button onclick="saveRecord()" class="w-full bg-gradient-to-r from-teal-600 to-emerald-700 text-white py-4 rounded-2xl font-bold shadow-xl active:scale-95 transition">紀錄並進化</button>
        </div>

        <div class="space-y-4">
            <h2 class="font-bold text-teal-200 ml-2">🌌 已解鎖精靈</h2>
            <div id="unlockedGrid" class="grid grid-cols-3 gap-3">
                </div>
        </div>

        <div class="card p-6">
            <h2 class="font-bold mb-4 text-teal-200 border-b border-white/10 pb-2 text-sm">🏆 修行榜單</h2>
            <div id="leaderboard" class="space-y-3 text-sm"></div>
        </div>
    </div>

    <script>
        // --- 請務必填入你的 Supabase 資訊 ---
        const SUPABASE_URL = 'https://szzpoyluooexmshcmpmk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tsVcpheph5XujUP9CGPRwA_pMlGNpb3';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const characters = [
            { name: '懶石頭', req: 0, img: 'https://cdn-icons-png.flaticon.com/512/2602/2602465.png' },
            { name: '雲朵雞', req: 100, img: 'https://cdn-icons-png.flaticon.com/512/2663/2663067.png' },
            { name: '綠毛蟲', req: 200, img: 'https://cdn-icons-png.flaticon.com/512/805/805404.png' },
            { name: '波波貓', req: 300, img: 'https://cdn-icons-png.flaticon.com/512/616/616430.png' },
            { name: '狐狸仙', req: 400, img: 'https://cdn-icons-png.flaticon.com/512/235/235880.png' },
            { name: '鹿角獸', req: 500, img: 'https://cdn-icons-png.flaticon.com/512/2219/2219774.png' },
            { name: '獨角鯨', req: 600, img: 'https://cdn-icons-png.flaticon.com/512/2040/2040510.png' },
            { name: '大白龍', req: 700, img: 'https://cdn-icons-png.flaticon.com/512/616/616606.png' },
            { name: '火鳳凰', req: 800, img: 'https://cdn-icons-png.flaticon.com/512/2026/2026462.png' },
            { name: '星系主', req: 900, img: 'https://cdn-icons-png.flaticon.com/512/2534/2534064.png' }
        ];

        // 啟動背景音樂 (因瀏覽器限制，需由使用者觸發點擊)
        document.body.addEventListener('click', () => {
            const music = document.getElementById('bgMusic');
            if (music.paused) music.play();
        }, { once: true });

        async function fetchData() {
            const { data: logs, error } = await client.from('meditation_logs').select('*').order('created_at', { ascending: false });
            if(error) return;

            const userScores = {};
            logs.forEach(l => userScores[l.username] = (userScores[l.username] || 0) + l.coins);
            
            updateUI(logs, userScores);
        }

        function updateUI(logs, userScores) {
            const name = document.getElementById('username').value.trim();
            const myScore = userScores[name] || 0;

            // 1. 排行榜
            const sorted = Object.entries(userScores).sort((a,b) => b[1]-a[1]);
            document.getElementById('leaderboard').innerHTML = sorted.slice(0, 5).map(([n, s], i) => `
                <div class="flex justify-between items-center opacity-90">
                    <span>${i+1}. ${n}</span>
                    <span class="text-xs font-mono text-teal-300">${s} 幣</span>
                </div>
            `).join('');

            // 2. 進度條
            const next = characters.find(c => c.req > myScore) || characters[9];
            const prog = myScore >= 900 ? 100 : (myScore / next.req) * 100;
            document.getElementById('progressBarFill').style.width = prog + '%';
            document.getElementById('rankDisplay').innerHTML = name ? 
                (myScore >= 900 ? `✨ 已達到最高境界` : `距離進化到 <b>${next.name}</b> 還差 ${next.req - myScore} 幣`) : "同步修行中...";

            // 3. 只呈現已解鎖的圖鑑 (重點修改)
            const unlocked = characters.filter(c => myScore >= c.req);
            document.getElementById('unlockedGrid').innerHTML = unlocked.map(c => `
                <div class="card p-3 flex flex-col items-center border-teal-500/30 animate-pulse">
                    <img src="${c.img}" class="w-12 h-12 mb-2">
                    <span class="text-[10px] font-bold text-teal-100 text-center">${c.name}</span>
                </div>
            `).join('');
        }

        async function saveRecord() {
            const username = document.getElementById('username').value.trim();
            const minutes = parseInt(document.getElementById('minutes').value);
            const note = document.getElementById('note').value;
            if(!username || !minutes) return alert('別忘了填名字和時間喔');

            let coins = 0;
            if (minutes >= 40) coins = 40;
            else if (minutes >= 30) coins = 20;
            else if (minutes >= 20) coins = 10;
            else return alert('禪定未滿20分鐘，能量還不足以產生禪定幣...');

            const { error } = await client.from('meditation_logs').insert([{ username, minutes, note, coins }]);
            if(error) alert('連線失敗');
            else {
                alert('紀錄成功，心靈能量已同步！');
                document.getElementById('minutes').value = '';
                document.getElementById('note').value = '';
                fetchData();
            }
        }

        document.getElementById('username').addEventListener('input', fetchData);
        setInterval(fetchData, 10000);
        fetchData();
    </script>
</body>
</html>
